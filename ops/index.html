<style>
/* Layout: a lab bench console. Summary tiles on top, a job board below, one drawer per sample. */
/* Light: white surfaces, deep navy ink, green action, blue information, orange attention. All text pairs meet WCAG AA. */
:root {
  --bg: #F3F5FA;
  --surface: #FFFFFF;
  --surface-2: #ECEFF6;
  --ink: #0A1030;
  --text: #232A52;
  --muted: #485078;
  --line: #CDD3E3;
  --accent: #13773A;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCF2E3;
  --navy: #2430A0;
  --good: #13773A; --good-soft: #DCF2E3;
  --warn: #A3460A; --warn-soft: #FFE6D1;
  --bad: #B42318; --bad-soft: #FDE0DC;
  --info: #2430A0; --info-soft: #E2E6FF;
  --bar: #2F4BE0; --orange: #E8680F; --green-bright: #1FA855;
  --shadow: 0 1px 2px rgba(10, 16, 48, 0.06), 0 10px 28px -18px rgba(10, 16, 48, 0.28);
  --logo-light: block; --logo-dark: none;
  --font-display: 'Lexend', Verdana, sans-serif;
  --font-body: 'IBM Plex Sans', Arial, sans-serif;
  --font-mono: 'IBM Plex Mono', 'Courier New', monospace;
  --r: 12px;
}
/* Dark (the default): near-black navy, bright white text, luminous green, blue and orange accents. */
:root[data-theme="dark"] {
  --bg: #050918; --surface: #0C1330; --surface-2: #141C42; --ink: #F6F8FF; --text: #DCE1F7; --muted: #AAB2DA; --line: #263266;
  --accent: #2FC46C; --accent-ink: #02130A; --accent-soft: #0E3A23; --navy: #A3B4FF;
  --good: #52DA8E; --good-soft: #0E3A23; --warn: #FFA552; --warn-soft: #3E2410; --bad: #FF8073; --bad-soft: #401814; --info: #A3B4FF; --info-soft: #182462;
  --bar: #6F8CFF; --orange: #FF8A2B; --green-bright: #2FC46C;
  --shadow: 0 1px 0 rgba(255, 255, 255, 0.03) inset, 0 12px 32px -20px rgba(0, 0, 0, 0.9);
  --logo-light: none; --logo-dark: block; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-display); color: var(--ink); margin: 0; line-height: 1.2; text-wrap: balance; }
h2 { font-size: 22px; font-weight: 600; }
h3 { font-size: 16px; font-weight: 600; }
p { margin: 0; }
.mono { font-family: var(--font-mono); }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
:focus-visible { outline: 3px solid var(--warn); outline-offset: 2px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-inner, .tabs-inner, main, .banner-inner { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-inner { display: flex; align-items: center; gap: 14px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand img { height: 34px; width: auto; }
.logo-on-light { display: var(--logo-light); }
.logo-on-dark { display: var(--logo-dark); }
.brand .app-name { font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); border-left: 1px solid var(--line); padding-left: 10px; }
.spacer { flex: 1; }
.conn { font-family: var(--font-mono); font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.conn.ok { background: var(--good-soft); color: var(--good); }
.conn.warn { background: var(--warn-soft); color: var(--warn); }
.tabs { background: var(--surface); border-bottom: 1px solid var(--line); }
.tabs-inner { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tab { border: 0; background: none; padding: 12px 14px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.banner { background: var(--warn-soft); color: var(--warn); }
.banner.demo { background: var(--info-soft); color: var(--info); }
.banner-inner { padding-block: 10px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-weight: 500; }
main { padding-block: 24px 64px; display: grid; gap: 24px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 999px; padding: 9px 16px; font-weight: 600; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); }
.btn.small { padding: 5px 12px; font-size: 13.5px; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 4px; }
.kpi .label { font-size: 12.5px; color: var(--muted); font-family: var(--font-mono); letter-spacing: 0.04em; text-transform: uppercase; }
.kpi .value { font-family: var(--font-display); font-size: 28px; font-weight: 600; color: var(--ink); line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .sub { font-size: 13px; color: var(--muted); }
.kpi.bad { border-color: var(--bad); background: var(--bad-soft); }
.kpi.bad .value { color: var(--bad); }
.kpi.warn { border-color: var(--warn); background: var(--warn-soft); }

.grid2 { display: grid; gap: 16px; }
@media (min-width: 980px) { .grid2 { grid-template-columns: 1.1fr 0.9fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.panel-head .hint { font-size: 13px; color: var(--muted); }

.alerts { display: grid; gap: 8px; }
.alert { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); border: 0; text-align: left; cursor: pointer; width: 100%; }
.alert .what { min-width: 0; }
.alert .what b { color: var(--ink); }
.alert .what span { display: block; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 560px) { .alert { grid-template-columns: auto 1fr; } .alert > .note { display: none; } }
.chip { font-family: var(--font-mono); font-size: 11.5px; font-weight: 500; padding: 3px 8px; border-radius: 999px; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.info { background: var(--info-soft); color: var(--info); }

.pipeline { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.stage { padding: 10px; border-radius: 10px; background: var(--surface-2); display: grid; gap: 2px; border: 0; text-align: left; cursor: pointer; }
.stage b { font-family: var(--font-display); font-size: 22px; color: var(--ink); }
.stage span { font-size: 12px; color: var(--muted); line-height: 1.25; }
@media (max-width: 560px) { .pipeline { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-family: var(--font-mono); font-size: 11px; }
.chart .val { fill: var(--ink); }
.hbars { display: grid; gap: 8px; }
.hbar { display: grid; grid-template-columns: minmax(90px, 160px) 1fr 44px; gap: 10px; align-items: center; font-size: 13.5px; }
.hbar .track { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.hbar .fill { height: 100%; background: var(--bar); border-radius: 99px; }
.hbar .n { text-align: right; font-family: var(--font-mono); color: var(--ink); }

.filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.fchip { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: 13.5px; font-weight: 500; }
.fchip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.search { flex: 1; min-width: 180px; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.jobs { display: grid; gap: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.job { display: grid; grid-template-columns: 265px minmax(0, 1.4fr) minmax(0, 1fr) 120px 130px 110px; gap: 12px; align-items: center; padding: 12px 16px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; cursor: pointer; width: 100%; }
.job:last-child { border-bottom: 0; }
.job:hover { background: var(--surface-2); }
.job.head { cursor: default; background: var(--surface-2); font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding-block: 8px; }
.job .id { font-family: var(--font-mono); font-size: 13px; color: var(--ink); font-weight: 500; }
.job .cell { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.job .cell small { display: block; color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 860px) {
  .job { grid-template-columns: 1fr auto; row-gap: 4px; }
  .job.head { display: none; }
  .job .c-sample, .job .c-due { display: none; }
}
.empty { padding: 32px 20px; text-align: center; display: grid; gap: 10px; justify-items: center; color: var(--muted); }
.empty h3 { color: var(--ink); }

form.panel { gap: 16px; }
.fgrid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
.field { display: grid; gap: 5px; min-width: 0; }
.field label, .field .lab { font-size: 13px; font-weight: 600; color: var(--ink); }
.field .help { font-size: 12.5px; color: var(--muted); }
input, select, textarea { width: 100%; min-width: 0; padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); }
input[type="checkbox"], input[type="radio"] { width: auto; }
textarea { min-height: 70px; resize: vertical; }
.tests { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); }
.test-opt { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); cursor: pointer; }
.test-opt.off { opacity: 0.45; cursor: not-allowed; }
.test-opt .code { font-family: var(--font-mono); font-size: 12px; color: var(--muted); display: block; }
.test-opt .p { font-family: var(--font-mono); font-size: 13px; color: var(--ink); }
.summary { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; padding: 14px 16px; border-radius: 10px; background: var(--accent-soft); }
.summary div { display: grid; }
.summary .k { font-size: 12px; color: var(--muted); font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.05em; }
.summary .v { font-family: var(--font-display); font-size: 20px; color: var(--ink); font-weight: 600; }

.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); }
table { width: 100%; border-collapse: collapse; font-size: 14px; background: var(--surface); }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 500; background: var(--surface-2); }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }

.drawer-back { position: fixed; inset: 0; background: rgba(12, 13, 34, 0.45); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--surface); z-index: 41; overflow-y: auto; box-shadow: -12px 0 32px rgba(12, 13, 34, 0.25); padding: calc(18px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) calc(32px + env(safe-area-inset-bottom, 0px)) 18px; display: grid; gap: 16px; align-content: start; }
.drawer-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
.drawer-head .id { font-family: var(--font-mono); font-size: 18px; color: var(--ink); font-weight: 500; }
.kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
.box { border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 12px; }
.results { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); }
.res-row { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.res-row:last-child { border-bottom: 0; }
.steps-mini { display: flex; gap: 4px; }
.steps-mini span { flex: 1; height: 5px; border-radius: 9px; background: var(--surface-2); }
.steps-mini span.on { background: var(--accent); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; z-index: 60; font-weight: 500; max-width: calc(100% - 32px); }
pre.msg { margin: 0; white-space: pre-wrap; font-family: var(--font-mono); font-size: 12.5px; background: var(--surface-2); padding: 12px; border-radius: 10px; color: var(--ink); }
.note { font-size: 13px; color: var(--muted); }
.who { font-size: 13px; color: var(--ink); font-weight: 600; white-space: nowrap; }
.who small { font-weight: 400; color: var(--muted); }
.login { max-width: 440px; width: 100%; margin: 24px auto; }
.login form { display: grid; gap: 14px; }
.login .err { color: var(--bad); font-size: 13.5px; min-height: 1.2em; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; cursor: pointer; text-decoration: underline; }
.theme-btn { width: 34px; height: 34px; padding: 0; border-radius: 50%; }
.theme-btn svg { width: 16px; height: 16px; }
.code { display: inline-flex; flex-wrap: wrap; gap: 4px; font-family: var(--font-mono); font-size: 12px; }
.code span { padding: 2px 6px; border-radius: 6px; background: var(--surface-2); color: var(--ink); white-space: nowrap; }
.code span.pending { color: var(--muted); border: 1px dashed var(--line); background: none; }
.code span b { font-weight: 500; color: var(--muted); margin-right: 3px; }
.codebox { display: grid; gap: 8px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.codebox div { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: grid; gap: 2px; min-width: 0; }
.codebox .k { font-size: 11.5px; color: var(--muted); font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.05em; }
.codebox .v { font-family: var(--font-mono); color: var(--ink); font-weight: 500; overflow-wrap: anywhere; }
.codebox .pending .v { color: var(--muted); }
@media (max-width: 520px) { .codebox { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.routine { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.routine li { display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.routine li:last-child { border-bottom: 0; }
.routine time { font-family: var(--font-mono); color: var(--ink); font-weight: 500; }
.routine li.now { background: var(--accent-soft); margin: 0 -10px; padding-inline: 10px; border-radius: 8px; }
.picklist { display: grid; gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; max-height: 420px; overflow-y: auto; }
.pick { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.pick:last-child { border-bottom: 0; }
.pick:hover { background: var(--surface-2); }
.pick .cell { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick small { display: block; color: var(--muted); font-size: 12.5px; }
.meter { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--bar); border-radius: 99px; }
.alert .cell { min-width: 0; }
.alert .cell small { display: block; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rolecard { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.rolecard summary { cursor: pointer; padding: 12px 14px; display: grid; gap: 2px; list-style: none; }
.rolecard summary::-webkit-details-marker { display: none; }
.rolecard summary b { color: var(--ink); font-family: var(--font-display); font-size: 16px; }
.rolecard summary::after { content: "Show what this role can do"; font-size: 12.5px; color: var(--accent); font-weight: 600; }
.rolecard[open] summary::after { content: "Hide"; }
.rolegrid { display: grid; gap: 14px; padding: 0 14px 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
.rolegrid .k { font-family: var(--font-mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 4px; }
.rolegrid ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 14px; }
.rolegrid ul li { padding-left: 22px; position: relative; }
.rolegrid ul.can li::before { content: "✓"; position: absolute; left: 0; color: var(--good); font-weight: 700; }
.rolegrid ul.cant li { color: var(--muted); }
.rolegrid ul.cant li::before { content: "✕"; position: absolute; left: 0; color: var(--bad); }
.demo-users { display: grid; gap: 10px; }
.demo-user { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
.perm-table td, .perm-table th { text-align: center; }
.perm-table td:first-child, .perm-table th:first-child { text-align: left; }
.job.client-row { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) 130px 110px minmax(0, 1.2fr) 110px; }
@media (max-width: 860px) { .job.client-row { grid-template-columns: 1fr auto; } }
.batch-sel { width: auto; min-width: 180px; padding: 6px 10px; border-radius: 999px; font-size: 13.5px; }
/* ---------- Console chrome: a navy command bar in both themes ---------- */
.top, .depts-wrap { --surface: #0C1330; --surface-2: #18214D; --ink: #F6F8FF; --text: #DCE1F7; --muted: #AAB2DA; --line: #2C3870;
  --good: #52DA8E; --good-soft: #0E3A23; --warn: #FFA552; --warn-soft: #3E2410; --accent: #2FC46C; --accent-ink: #02130A; color: var(--text); }
.top { background: linear-gradient(100deg, #070C22 0%, #0E1740 60%, #13205A 100%); border-bottom: 0; }
.top .logo-on-light { display: none; } .top .logo-on-dark { display: block; }
.top .brand .app-name { color: #C8D0F5; border-color: #2C3870; }
.depts-wrap { background: #0A1132; border-bottom: 1px solid #1E2A5E; position: relative; }
.depts-wrap::after { content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: 2px; background: linear-gradient(90deg, #2FC46C, #2F4BE0 55%, #FF8A2B); }
.depts { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }

th { color: var(--muted); }

.use-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px 2px 6px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; vertical-align: 1px; }

  // Samples list
  const FILTERS = [['open', 'Open'], ['unpaid', 'Waiting for payment'], ['inlab', 'In the lab'], ['review', 'Awaiting sign-off'], ['ready', 'To send'], ['reported', 'Reported'], ['overdue', 'Overdue'], ['flagged', 'Above or close to limit'], ['grind', 'To grind'], ['wet', 'Wet'], ['consult', 'Consultation'], ['dispose', 'To dispose'], ['all', 'All']];

  function filtered() {

      const F = state.f;

  }
  function readResults(s) {
    const out = Object.assign({}, s.results || {});
    for (const f of fieldsFor(s)) { const el = $('#r-' + f); if (!el) continue; const v = el.value.trim(); out[f] = v === '' ? null : Number(v); }
    return out;
  }
  function resultsMsg(s) {
    const r = s.results || {}; const ov = overall(s);
    const lines = fieldsFor(s).filter(f => r[f] != null && r[f] !== '').map(f => { const F = FIELDS[f]; const v = verdictOf(f, r[f]); return `${F.label}: ${r[f]} ${F.unit}${v ? ' (' + VERDICT_LABEL[v].toLowerCase() + ', limit ' + F.limit + ')' : ''}`; });
    let advice = '';
    if (ov === 'above') advice = '\nThis sample is above the legal limit. Please do not feed it to lactating cows. Reply HELP and our lab manager will call you.';
    else if (ov === 'close') advice = '\nThis sample is close to the limit. Store feed dry and test the next batch. Reply HELP for advice.';
    const consult = s.consult ? '\nYour nutritional consultation is booked: our nutritionist will call you to explain these results and what to change in the ration.' : '\nWant help reading these results? Reply CONSULT to add a nutritional consultation.';
    return `Hello ${s.client.name}, your AgriLab results for ${s.id} (${s.sampleType}) are ready.\nSample code: ${sampleCode(s)}${s.batch ? ' · batch ' + s.batch : ''}\n${lines.join('\n')}${ov ? '\nVerdict: ' + VERDICT_LABEL[ov] : ''}${advice}${consult}\nResults relate only to the sample tested. Know before you feed.`;
  }
  function reportHtml(s) {
    const r = s.results || {};
    const rows = fieldsFor(s).map(f => { const F = FIELDS[f]; const v = verdictOf(f, r[f]); return `<tr><td>${esc(F.label)}</td><td style="text-align:right">${r[f] == null || r[f] === '' ? '—' : esc(r[f])}</td><td>${esc(F.unit)}</td><td>${F.limit != null ? esc(F.limit) + ' (' + esc(F.basis) + ')' : '—'}</td><td>${v ? esc(VERDICT_LABEL[v]) : '—'}</td></tr>`; }).join('');
    const METHOD_TEXT = { NIR: 'Near-infrared (NIR) analysis (dry chemistry)', ELISA: 'ELISA', 'Wet chemistry': 'Wet chemistry reference methods', 'Oven moisture': 'Oven-drying moisture' };
    const methods = methodsOf(s).map(m => METHOD_TEXT[m] || m).join('; ');
    const ov = overall(s);
    return `<!doctype html><html><head><meta charset="utf-8"><title>AgriLab report ${esc(s.id)}</title><style>body{font-family:Arial,sans-serif;color:#1C1D4A;max-width:760px;margin:32px auto;padding:0 20px;font-size:14px}h1{font-size:20px;margin:16px 0 4px}table{width:100%;border-collapse:collapse;margin:12px 0}td,th{border-bottom:1px solid #E0E3EB;padding:7px 6px;text-align:left}th{background:#F2F4F8;font-size:12px;text-transform:uppercase}.kv td:first-child{color:#61657F;width:170px}.v{display:inline-block;padding:6px 12px;border-radius:20px;background:${ov === 'above' ? '#FADAD5' : ov === 'close' ? '#FBE9C9' : '#DCEBD8'};font-weight:bold}.small{color:#61657F;font-size:12px}</style></head><body><img src="${LOGO}" alt="AgriLab Solutions" style="height:56px"><h1>Test report ${esc(s.id)}</h1><p class="small">AgriLab Solutions · Horizon Business Park, Kenol · +254 701 321 020 · lawrence@agrilabsolutions.com</p><table class="kv"><tr><td>Sample code</td><td>${esc(sampleCode(s))}${s.batch ? ' · batch ' + esc(s.batch) : ''}</td></tr><tr><td>Client</td><td>${esc(s.client.name)} (${esc(s.client.type)})</td></tr><tr><td>County of origin</td><td>${esc(s.county || s.client.area || '—')}${s.landmark ? ' · ' + esc(s.landmark) : ''}</td></tr><tr><td>Sample</td><td>${useText(s) ? esc(useText(s)) + ': ' : ''}${esc(s.sampleType)}${s.description ? ' · ' + esc(s.description) : ''}${s.sampleState ? ' · ' + (s.sampleState === 'wet' ? 'wet' : 'dry') : ''}${s.grinding ? ', ground before testing' : ''}</td></tr><tr><td>Date sampled</td><td>${esc(s.sampledOn || '—')}</td></tr><tr><td>Received</td><td>${esc(fmtDT(s.receivedAt))}</td></tr><tr><td>Paid</td><td>${esc(s.paid ? fmtDT(s.paidAt || s.receivedAt) : '—')}</td></tr><tr><td>Tested</td><td>${esc(fmtDT(s.startedAt))}</td></tr><tr><td>Reported</td><td>${esc(fmtDT(s.reportedAt || new Date().toISOString()))}</td></tr><tr><td>Tests</td><td>${esc((s.tests || []).map(c => TESTS[c] ? TESTS[c].name + ' (' + c + ')' : c).join(', '))}</td></tr><tr><td>Method</td><td>${esc(methods)}</td></tr></table><table><tr><th>Parameter</th><th style="text-align:right">Result</th><th>Unit</th><th>Limit</th><th>Verdict</th></tr>${rows}</table>${ov ? `<p>Overall: <span class="v">${esc(VERDICT_LABEL[ov])}</span></p>` : ''}${fieldsFor(s).includes('afm1') ? '<p class="small">Aflatoxin M1 is also compared by export buyers with the EU limit of 0.05 µg/kg.</p>' : ''}<p>Analysed by: ${esc(nameOf(s.analystId))} · Signed off by: ${esc(nameOf(s.reviewerId))}</p><p class="small">Results relate only to the sample as received. Sampling was the client’s responsibility unless AgriLab collected it. The sample is kept for up to two weeks after it was received, then disposed of.${s.consult ? ' A nutritional consultation is booked to explain these results.' : ''} AgriLab Solutions is working towards ISO/IEC 17025 accreditation. Know before you feed.</p></body></html>`;
  }
  async function drawerAction(act) {
    const s = data().samples.find(x => x.id === state.selected); if (!s) return;
    if (act === 'close') { clearDirty(['r-', 'p-', 'd-']); state.selected = null; renderDrawer(); return; }
    if (act === 'copy-results') { copy(resultsMsg(s)); return; }
    if (act === 'download') { saveFile(`AgriLab-report-${s.id}.html`, reportHtml(s), 'text/html'); return; }
    if (!canWriteNow()) return;
    if (act === 'start') {
      const sel = $('#d-batch'); const batch = sel ? sel.value : '';
      const ok = await startBatch([s.id], batch);
      if (ok) render();
      return;
    }
    if (act === 'dispose') { if (await markDisposed([s.id])) render(); return; }
    if (act === 'consult-done') {
      const j = await call('updateSample', { id: s.id, patch: { consultDone: true }, expect: s.updatedAt }, 'Consultation marked as done');
      if (j) { replaceSample(j.sample); render(); }
      return;
    }
    const flatResults = () => { const r = readResults(s); const out = {}; fieldsFor(s).forEach(f => { out[f] = r[f] == null || isNaN(r[f]) ? null : r[f]; }); return out; };
    let patch = null, msg = '';
    if (act === 'save-results') { patch = flatResults(); msg = 'Results saved'; }
    else if (act === 'to-review') {
      const res = flatResults();
      const missing = (s.tests || []).filter(c => !TESTS[c].fields.some(f => res[f] != null));
      if (missing.length) { toast('Enter at least one result for ' + missing.join(', ')); return; }
      patch = Object.assign(res, { status: 'review' }); msg = 'Sent for review';
    }
    else if (act === 'sign') { patch = { status: 'ready' }; msg = 'Signed off'; }
    else if (act === 'return') { patch = { status: 'analysis' }; msg = 'Returned to analyst'; }
    else if (act === 'mark-sent') { patch = { status: 'reported' }; msg = 'Marked as sent'; }
    else if (act === 'save-pay') {
      const paid = $('#p-paid').checked, mpesa = $('#p-mpesa').value.trim().toUpperCase(), price = Number($('#p-amt').value) || 0;
      if (paid && !mpesa && price > 0) { toast('Enter the M-Pesa code first'); return; }
      patch = { paid, mpesa, price }; msg = 'Payment saved';
    }
    else if (act === 'save-notes') { patch = { notes: $('#d-notes').value }; msg = 'Notes saved'; }
    if (!patch) return;
    const busy = document.querySelector(`.drawer [data-act="${act}"]`); if (busy) busy.disabled = true;
    const j = await call('updateSample', { id: s.id, patch, expect: s.updatedAt }, msg);
    if (j) { replaceSample(j.sample); clearDirty(['r-', 'p-', 'd-']); render(); }
    else if (busy) busy.disabled = false;
  }

  // Stock & QC

      <form id="stockForm" class="fgrid" novalidate style="align-items:end">
        <div class="field"><label for="s-item">Kit</label><input id="s-item" list="kitList" placeholder="e.g. Aflatoxin M1 ELISA kit" ${ro ? 'disabled' : ''}><datalist id="kitList"><option>Aflatoxin B1 ELISA kit</option><option>Total aflatoxin ELISA kit</option><option>Aflatoxin M1 ELISA kit</option><option>Fumonisin ELISA kit</option><option>DON ELISA kit</option><option>Zearalenone ELISA kit</option><option>Ochratoxin A ELISA kit</option></datalist></div>

        <div class="field"><button class="btn primary" type="submit" ${ro || !can('stock') ? 'disabled' : ''}>Add kit lot</button></div>

        <div class="field"><button class="btn primary" type="submit" ${ro || !can('qc') ? 'disabled' : ''}>${tq.date ? 'Update today’s QC' : 'Save today’s QC'}</button></div>

      ${qc.length ? `<div class="tbl-wrap"><table><thead><tr><th>Date</th><th>NIR check</th><th>ELISA control</th><th class="r">Fridge</th><th>Notes</th><th>By</th></tr></thead><tbody>${qcRows}</tbody></table></div>` : `<p class="note">No QC entries yet.</p>`}
      </section>`;
  }

  // Close-out
  let closeDay = null;
  function viewCloseout() {

    ['16:30', 'Dispose of two-week-old samples. Clean up.'],
    ['17:00', 'Close-out.']
  ];
  const ROUTINE_SAT = [
    ['08:00', 'Fridge reading, NIR check sample, QC log.'],
    ['08:30', 'Reception, payments, drop-offs.'],
    ['09:00', 'Dry and grind.'],
    ['10:00', 'Express cut-off; NIR runs.'],
    ['12:00', 'Sign-off; send reports.'],
    ['12:30', 'Dispose of two-week-old samples.'],

  const PICK_METHODS = ['All', 'NIR', 'ELISA', 'Wet chemistry', 'Oven moisture'];
  function viewPlan() {
    const { samples } = data(); const ro = state.readOnly || state.canWrite === false;
    const e = eat(now()); const dayName = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][e.dow];
    const routine = e.dow === 0 ? [] : e.dow === 6 ? ROUTINE_SAT : ROUTINE;
    const hm = `${pad(e.h)}:${pad(e.mi)}`;
    let cur = -1; routine.forEach(([t], i) => { if (t <= hm) cur = i; });
    const received = samples.filter(s => s.status === 'received');
    const unpaid = received.filter(s => !s.paid);
    const prep = received.filter(s => s.grinding || s.sampleState === 'wet');
    const m = state.pickMethod || 'All';
    const ready = received.filter(s => s.paid && (m === 'All' || methodsOf(s).includes(m)));
    const allReady = received.filter(s => s.paid);
    Object.keys(state.picked).forEach(id => { if (!allReady.some(s => s.id === id)) delete state.picked[id]; });
    const picked = Object.keys(state.picked);
    const open = openBatches();
    const soon = new Date(now().getTime() + 2 * 864e5);

    const openRow = s => `<button class="alert" type="button" data-open="${esc(s.id)}"><span class="chip ${s.paid ? 'info' : 'warn'}">${s.paid ? (s.sampleState === 'wet' ? 'Wet' : 'Dry') : 'Unpaid'}</span>${line(s, s.paid ? (s.grinding ? 'grind' : '') + (s.sampleState === 'wet' ? (s.grinding ? ', ' : '') + 'keep in the fridge, dry before NIR' : '') : kes(s.price) + ' to pay in full')}<span class="note">Open</span></button>`;
    return `
      <div class="kpis">
        <div class="kpi ${unpaid.length ? 'warn' : ''}"><span class="label">Waiting for payment</span><span class="value">${unpaid.length}</span><span class="sub">not tested until paid in full</span></div>
        <div class="kpi"><span class="label">To prepare</span><span class="value">${prep.length}</span><span class="sub">${received.filter(s => s.grinding).length} to grind · ${received.filter(s => s.sampleState === 'wet').length} wet</span></div>
        <div class="kpi"><span class="label">Ready to batch</span><span class="value">${allReady.length}</span><span class="sub">paid, not yet tested</span></div>
        <div class="kpi"><span class="label">Open batches</span><span class="value">${open.length}</span><span class="sub">up to ${BATCH_MAX} samples each</span></div>
        <div class="kpi ${dispose.some(s => new Date(disposeByOf(s)) < now()) ? 'bad' : dispose.length ? 'warn' : ''}"><span class="label">To dispose</span><span class="value">${dispose.length}</span><span class="sub">at or near two weeks</span></div>
        <div class="kpi"><span class="label">Consultations</span><span class="value">${consults.length}</span><span class="sub">to call</span></div>
      </div>
      <div class="grid2">
        <section class="panel"><div class="panel-head"><h2>${esc(dayName)}’s routine</h2><span class="hint">${e.dow === 0 ? 'The lab is closed on Sundays' : e.dow === 6 ? 'Saturday: 8 am to 1 pm' : 'Monday to Friday: 8 am to 5 pm'}</span></div>
          ${routine.length ? `<ol class="routine">${routine.map(([t, w], i) => `<li class="${i === cur ? 'now' : ''}"><time>${t}</time><span>${esc(w)}</span></li>`).join('')}</ol>` : '<p class="note">No routine on Sundays. Samples dropped off today are logged on Monday morning.</p>'}
        </section>
        <section class="panel"><div class="panel-head"><h2>Prepare and pay</h2><span class="hint">received, not yet tested</span></div>
          ${received.length ? `<div class="alerts">${received.filter(s => !s.paid).concat(prep.filter(s => s.paid)).slice(0, 14).map(openRow).join('')}</div>` : '<p class="note">Nothing waiting. Every received sample is in a batch.</p>'}
        </section>
      </div>
      <section class="panel"><div class="panel-head"><h2>Build a test batch</h2><span class="hint">Only samples paid in full can be added. One batch holds up to ${BATCH_MAX}.${can('batch') ? '' : ' Batches are started by: ' + esc(whoCan('batch')) + '.'}</span></div>
        <div class="filters">${PICK_METHODS.map(x => `<button class="fchip" type="button" data-pmethod="${esc(x)}" aria-pressed="${m === x}">${esc(x)}</button>`).join('')}<span class="spacer"></span><button class="btn small" type="button" data-action="pick-all" ${ro || !can('batch') || !ready.length ? 'disabled' : ''}>Select all shown</button><button class="btn small" type="button" data-action="pick-none" ${!picked.length ? 'disabled' : ''}>Clear</button></div>
        ${ready.length ? `<div class="picklist">${ready.map(pickRow).join('')}</div>` : `<p class="note">No paid samples waiting${m === 'All' ? '' : ' for ' + esc(m)}.</p>`}
        <div class="row"><span class="summary" style="padding:8px 14px"><span class="num"><b>${picked.length}</b> / ${BATCH_MAX} selected</span></span>
          <select id="pb-batch" class="batch-sel" aria-label="Batch to add to"><option value="">New batch</option>${open.filter(([, n]) => n < BATCH_MAX).map(([b, n]) => `<option value="${esc(b)}">Add to ${esc(b)} · ${n}/${BATCH_MAX}</option>`).join('')}</select>
          <button class="btn primary" type="button" data-action="start-batch" ${ro || !can('batch') || !picked.length || picked.length > BATCH_MAX ? 'disabled' : ''}>Start testing</button>
          ${picked.length > BATCH_MAX ? `<span class="chip bad">A batch holds at most ${BATCH_MAX}</span>` : ''}</div>
      </section>
      <section class="panel"><div class="panel-head"><h2>Awaiting sign-off</h2><span class="hint">${can('signOff') ? 'second check before results leave the lab' : 'signed off by ' + esc(whoCan('signOff'))}</span></div>
        ${(() => { const rv = samples.filter(s => s.status === 'review'); return rv.length ? `<div class="alerts">${rv.map(s => `<button class="alert" type="button" data-open="${esc(s.id)}"><span class="chip info">Sign-off</span>${line(s, 'entered by ' + esc(nameOf(s.analystId)))}<span class="note">Open</span></button>`).join('')}</div>` : '<p class="note">Nothing waiting for sign-off.</p>'; })()}
      </section>
      <div class="grid2">
        <section class="panel"><div class="panel-head"><h2>Open batches</h2><span class="hint">tap one to see its samples</span></div>
          ${open.length ? open.map(([b, n]) => { const l = samples.filter(s => s.batch === b); const done = l.filter(s => STATUS_INDEX[s.status] >= 2).length; return `<button class="alert" type="button" data-batch-go="${esc(b)}" style="grid-template-columns:1fr auto"><span class="what"><b class="mono">${esc(b)}</b> · ${n}/${BATCH_MAX} samples<span>${done} of ${n} with results · ${esc([...new Set(l.flatMap(methodsOf))].join(', '))}</span><span class="meter" style="margin-top:6px"><span style="width:${(n / BATCH_MAX * 100).toFixed(1)}%"></span></span></span><span class="note">Show</span></button>`; }).join('') : '<p class="note">No batch is in analysis right now.</p>'}
        </section>
        <section class="panel"><div class="panel-head"><h2>Dispose of samples</h2><span class="hint">no sample is kept longer than two weeks</span></div>
          ${dispose.length ? `<div class="picklist">${dispose.map(dispRow).join('')}</div><div class="row"><button class="btn primary small" type="button" data-action="dispose-picked" ${ro || !can('dispose') || !Object.keys(state.dpicked).length ? 'disabled' : ''}>Mark ${Object.keys(state.dpicked).length || ''} disposed</button><span class="note">Tick only bags that have actually been thrown away.</span></div>` : '<p class="note">No samples are due for disposal in the next two days.</p>'}
        </section>
      </div>
      <section class="panel"><div class="panel-head"><h2>Nutritional consultations to call</h2><span class="hint">results signed off, consultation not done yet</span></div>
        ${consults.length ? `<div class="alerts">${consults.map(s => `<button class="alert" type="button" data-open="${esc(s.id)}"><span class="chip info">Call</span>${line(s, esc(s.client.phone || 'no phone'))}<span class="note">Open</span></button>`).join('')}</div>` : '<p class="note">No consultations waiting.</p>'}

  }

  // Clients: accounts, loyalty tiers and portal access.
  const normPhone = p => { const d = String(p || '').replace(/\D/g, ''); return d.length === 10 && d[0] === '0' ? '254' + d.slice(1) : d.length === 9 && /^[17]/.test(d) ? '254' + d : d; };
  const clientByPhone = phone => { const n = normPhone(phone); return n ? (data().clients || []).find(c => normPhone(c.phone) === n) || null : null; };
  const settingsNow = () => data().settings || { tiers: DEFAULT_TIERS, period: '12m', retestDays: 30 };
  // Same rule as loyalty_() in apps-script/Code.gs: spend on paid samples (last 12 months or all time), paid samples, months as a client.
  function loyaltyOf(c) {
    // The lab sheet works out each client's tier (and, for those allowed, their spend); use that when it is there.
    if (c.loyalty) return Object.assign({}, c.loyalty, { samples: data().samples.filter(x => x.clientId === c.id) });
    const st = settingsNow(); const t = Date.now(), from = st.period === 'all' ? 0 : t - 365 * 864e5;
    const mine = data().samples.filter(x => x.clientId === c.id);
    const paid = mine.filter(x => x.paid && new Date(x.receivedAt).getTime() >= from);
    const spend = paid.reduce((a, x) => a + (Number(x.price) || 0), 0) + (data().subPayments || []).filter(x => x.clientId === c.id && new Date(x.at).getTime() >= from).reduce((a, x) => a + (Number(x.amount) || 0), 0);
    const first = mine.reduce((m, x) => x.receivedAt && x.receivedAt < m ? x.receivedAt : m, c.since || new Date().toISOString());
    const months = Math.max(0, Math.floor((t - new Date(first).getTime()) / (30.44 * 864e5)));
    const tiers = st.tiers.slice().sort((a, b) => a.minSpend - b.minSpend);
    const ok = x => spend >= x.minSpend && paid.length >= (x.minTests || 0) && months >= (x.minMonths || 0);
    let tier = null; tiers.forEach(x => { if (ok(x)) tier = x; });
    let next = null; tiers.forEach(x => { if (!next && !ok(x) && (!tier || x.minSpend > tier.minSpend)) next = x; });
    return { spend, tests: paid.length, months, since: first, period: st.period, tier, next, samples: mine };
  }
  const portalUrl = () => { try { return new URL('../portal/', location.href).href; } catch (e) { return '../portal/'; } };
  const nextNeeds = l => !l.next ? 'Top tier' : l.spend == null ? 'Next tier: ' + l.next.name : [l.spend < l.next.minSpend ? kes(l.next.minSpend - l.spend) + ' more spend' : '', l.tests < (l.next.minTests || 0) ? (l.next.minTests - l.tests) + ' more tests' : '', l.months < (l.next.minMonths || 0) ? (l.next.minMonths - l.months) + ' more months' : ''].filter(Boolean).join(', ') + ' to ' + l.next.name;
  function viewClients() {
    if (state.demo) return `<section class="panel"><div class="empty"><h3>Clients appear with live records</h3><p>Use the offline demo or the connected system to see client accounts and loyalty tiers.</p></div></section>`;
    const ro = state.readOnly || state.canWrite === false;
    const st = settingsNow();
    const all = (data().clients || []).map(c => ({ c, l: loyaltyOf(c) }));
    const q = (state.csearch || '').trim().toLowerCase();
    const list = all.filter(x => (state.cseg === 'all' || x.c.segment === state.cseg) && (!q || [x.c.name, x.c.phone, x.c.county, x.c.type].join(' ').toLowerCase().includes(q)))
      .sort((a, b) => b.l.spend - a.l.spend);
    const tierCount = {}; all.forEach(x => { const n = x.l.tier ? x.l.tier.name : '—'; tierCount[n] = (tierCount[n] || 0) + 1; });
    const draft = state.tierDraft || (state.tierDraft = { tiers: st.tiers.map(t => Object.assign({}, t)), period: st.period, retestDays: st.retestDays });
    const canL = can('loyalty') && !ro;
    const inp = (i, k, v, w) => `<input id="tier-${i}-${k}" ${k === 'name' ? '' : 'type="number" min="0"'} value="${esc(v)}" style="width:${w}px" ${canL ? '' : 'disabled'} aria-label="${k}">`;
    const tierRows = draft.tiers.map((t, i) => `<tr><td>${inp(i, 'name', t.name, 120)}</td><td class="r">${inp(i, 'minSpend', t.minSpend, 110)}</td><td class="r">${inp(i, 'minTests', t.minTests || 0, 70)}</td><td class="r">${inp(i, 'minMonths', t.minMonths || 0, 70)}</td><td class="r">${inp(i, 'discount', t.discount, 70)}</td><td class="r">${tierCount[t.name] || 0}</td><td>${canL && draft.tiers.length > 1 ? `<button class="btn small danger" type="button" data-action="tier-del" data-i="${i}">Remove</button>` : ''}</td></tr>`).join('');

      </section>`;
  }
  function clientPanel(c, l) {

  // ---------- icons: small line drawings that make samples quicker to read ----------

    const toCall = samples.filter(s => s.consult && !s.consultDoneAt && STATUS_INDEX[s.status] >= 3);

      </div>`;
  }

  // ---------- Marketing: for Sales & marketing and the Director ----------
  function viewMarketing() {
    if (!can('marketing')) return `<section class="panel"><div class="gate"><h3>Marketing figures are for ${esc(whoCan('marketing'))}</h3><p class="note">Ask them for this month’s numbers.</p></div></section>`;
    const { samples } = data(); const clients = data().clients || []; const pays = data().subPayments || []; const visitors = data().visitors || [];
    const P = state.mperiod, t = now().getTime(), from = t - P * 864e5, prevFrom = from - P * 864e5;
    const inP = x => new Date(x).getTime() >= from, inPrev = x => { const v = new Date(x).getTime(); return v >= prevFrom && v < from; };
    const rev = (fn) => samples.filter(s => s.paid && fn(s.receivedAt)).reduce((a, s) => a + (s.price || 0), 0) + pays.filter(x => fn(x.at)).reduce((a, x) => a + (Number(x.amount) || 0), 0);
    const revNow = rev(inP), revPrev = rev(inPrev);
    const byClient = {}; samples.forEach(s => { if (!s.clientId) return; (byClient[s.clientId] = byClient[s.clientId] || []).push(s); });
    const firstOf = c => { const l = byClient[c.id] || []; return l.reduce((m, s) => s.receivedAt < m ? s.receivedAt : m, c.since || new Date().toISOString()); };
    const lastOf = c => (byClient[c.id] || []).reduce((m, s) => s.receivedAt > m ? s.receivedAt : m, '');
    const channelOf = c => { const l = (byClient[c.id] || []).slice().sort((a, b) => a.receivedAt.localeCompare(b.receivedAt)); return (l[0] && l[0].heardVia) || 'Not recorded'; };
    const spendIn = (c, fn) => (byClient[c.id] || []).filter(s => s.paid && fn(s.receivedAt)).reduce((a, s) => a + (s.price || 0), 0) + pays.filter(x => x.clientId === c.id && fn(x.at)).reduce((a, x) => a + (Number(x.amount) || 0), 0);
    const active = clients.filter(c => (byClient[c.id] || []).some(s => inP(s.receivedAt)));
    const fresh = clients.filter(c => inP(firstOf(c)));
    const returning = active.filter(c => !inP(firstOf(c)));
    const mrr = subsOf().filter(x => x.status === 'active').reduce((a, x) => a + (Number(x.fee) || 0), 0);
    const sP = samples.filter(s => inP(s.receivedAt));
    const delta = revPrev ? Math.round((revNow - revPrev) / revPrev * 100) : null;
    const group = (keyFn) => { const m = {}; clients.forEach(c => { const k = keyFn(c) || 'Not recorded'; const g = m[k] = m[k] || { k, clients: 0, fresh: 0, active: 0, rev: 0 }; g.clients++; if (inP(firstOf(c))) g.fresh++; if (active.includes(c)) g.active++; g.rev += spendIn(c, inP); }); return Object.values(m).sort((a, b) => b.rev - a.rev || b.clients - a.clients); };
    const table = (title, rows, label) => `<section class="panel"><div class="panel-head"><h2>${title}</h2><span class="hint">last ${P} days</span></div><div class="tbl-wrap"><table class="mini-table"><thead><tr><th>${label}</th><th class="r">Clients</th><th class="r">New</th><th class="r">Active</th><th class="r">Revenue</th></tr></thead><tbody>${rows.slice(0, 10).map(g => `<tr><td>${esc(g.k)}</td><td class="r num">${g.clients}</td><td class="r num">${g.fresh}</td><td class="r num">${g.active}</td><td class="r num">${kes(g.rev)}</td></tr>`).join('') || '<tr><td colspan="5">No clients yet.</td></tr>'}</tbody></table></div></section>`;
    // Six months of revenue and new clients.
    const e = eat(now()); const months = [];
    for (let i = 5; i >= 0; i--) { const d = new Date(Date.UTC(e.y, e.m - i, 1)); months.push({ key: `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}`, m: d.getUTCMonth(), rev: 0, fresh: 0 }); }
    samples.forEach(s => { if (!s.paid) return; const mo = months.find(x => x.key === ymKey(s.receivedAt)); if (mo) mo.rev += s.price || 0; });
    pays.forEach(x => { const mo = months.find(y => y.key === ymKey(x.at)); if (mo) mo.rev += Number(x.amount) || 0; });
    clients.forEach(c => { const mo = months.find(x => x.key === ymKey(firstOf(c))); if (mo) mo.fresh++; });
    const W = 600, H = 200, mx = Math.max(1, ...months.map(x => x.rev)), bw = (W - 20) / 6;
    const chart = `<svg class="bigbar" viewBox="0 0 ${W} ${H}" role="img" aria-label="Revenue and new clients per month">${months.map((mo, i) => { const x = 10 + i * bw + 14, w = bw - 28, h = mo.rev / mx * (H - 60), y = H - 34 - h;
      return `<rect x="${x}" y="${y}" width="${w}" height="${Math.max(h, 1)}" rx="4" fill="var(--bar)"></rect><text class="val" x="${x + w / 2}" y="${y - 6}" text-anchor="middle">${mo.rev >= 1000 ? Math.round(mo.rev / 1000) + 'k' : mo.rev}</text><text x="${x + w / 2}" y="${H - 18}" text-anchor="middle">${MONTHS[mo.m]}</text><text x="${x + w / 2}" y="${H - 4}" text-anchor="middle" fill="var(--good)">+${mo.fresh} new</text>`; }).join('')}</svg>`;
    const lapsed = clients.filter(c => lastOf(c) && (t - new Date(lastOf(c)).getTime()) > 60 * 864e5).map(c => ({ c, spend: spendIn(c, () => true), last: lastOf(c) })).sort((a, b) => b.spend - a.spend).slice(0, 8);
    const prospects = clients.filter(c => !subFor(c.id)).map(c => ({ c, n: (byClient[c.id] || []).filter(s => (t - new Date(s.receivedAt).getTime()) < 90 * 864e5).length, spend: spendIn(c, x => (t - new Date(x).getTime()) < 90 * 864e5) })).filter(x => x.n >= 3 || x.spend >= 20000).sort((a, b) => b.spend - a.spend).slice(0, 8);
    const vP = visitors.filter(v => v.at && inP(v.at));
    const vConverted = vP.filter(v => { const c = clientByPhone(v.phone); return c && (byClient[c.id] || []).some(s => new Date(s.receivedAt) >= new Date(new Date(v.at).getTime() - 864e5)); });
    const tiers = {}; clients.forEach(c => { const l = loyaltyOf(c); const n = l.tier ? l.tier.name : '—'; tiers[n] = (tiers[n] || 0) + 1; });
    return `<div class="row"><h2 style="margin-right:auto">Sales and marketing</h2><label class="note" for="m-period">Period</label><select id="m-period" style="width:auto">${[30, 90, 365].map(d => `<option value="${d}" ${P === d ? 'selected' : ''}>Last ${d} days</option>`).join('')}</select><button class="btn small" type="button" data-action="mk-csv">Download client list</button></div>
      <div class="kpis">
        <div class="kpi good"><span class="label">Revenue</span><span class="value" style="font-size:22px">${kes(revNow)}</span><span class="sub">${delta == null ? 'tests and plan fees' : (delta >= 0 ? '▲ ' : '▼ ') + Math.abs(delta) + '% on the previous ' + P + ' days'}</span></div>
        <div class="kpi"><span class="label">Monthly recurring</span><span class="value" style="font-size:22px">${kes(mrr)}</span><span class="sub">${subsOf().filter(x => x.status === 'active').length} active plans</span></div>
        <div class="kpi"><span class="label">New clients</span><span class="value">${fresh.length}</span><span class="sub">first sample in the period</span></div>
        <div class="kpi"><span class="label">Active clients</span><span class="value">${active.length}</span><span class="sub">${active.length ? Math.round(returning.length / active.length * 100) : 0}% returning</span></div>
        <div class="kpi"><span class="label">Per active client</span><span class="value" style="font-size:22px">${kes(active.length ? revNow / active.length : 0)}</span><span class="sub">average revenue</span></div>
        <div class="kpi"><span class="label">Portal and consults</span><span class="value">${clients.length ? Math.round(clients.filter(c => c.portal).length / clients.length * 100) : 0}%</span><span class="sub">on the portal · ${sP.length ? Math.round(sP.filter(s => s.consult).length / sP.length * 100) : 0}% add a consult</span></div>
      </div>
      <section class="panel"><div class="panel-head"><h2>Revenue and new clients</h2><span class="hint">last six months</span></div>${chart}</section>
      <div class="grid2">${table('Where clients come from', group(channelOf), 'Heard about us via')}${table('Client groups', group(c => SEGMENT_LABEL[c.segment] || c.segment), 'Group')}</div>
      <div class="grid2">${table('Counties', group(c => c.county), 'County')}
        <section class="panel"><div class="panel-head"><h2>Feed and food</h2><span class="hint">samples, last ${P} days</span></div>
          <div class="use-grid">${[['food', 'Human food', sP.filter(s => s.purpose === 'food').length]].concat(ANIMALS.map(a => [a, a, sP.filter(s => s.purpose === 'feed' && s.animal === a).length])).filter(x => x[2]).map(([k, l, n]) => `<div class="use-cell ${k === 'food' ? 'food' : ''}">${icon(k)}<b>${n}</b><span>${esc(l)}</span></div>`).join('') || '<p class="note">No samples in this period.</p>'}</div>
          <div class="panel-head" style="margin-top:6px"><h3>Tests sold</h3></div>${hbars(sP.flatMap(s => (s.tests || []).map(c => (TESTS[c] ? TESTS[c].name : c))))}
          <div class="panel-head" style="margin-top:6px"><h3>Loyalty tiers</h3></div><div class="row">${Object.entries(tiers).map(([k, n]) => `<span class="chip ${k === '—' || k === 'Standard' ? '' : 'good'}">${esc(k)} · ${n}</span>`).join('')}</div>
          <div class="panel-head" style="margin-top:6px"><h3>Visitors to clients</h3></div><p>${vP.length} visitors in the period; ${vConverted.length} (${vP.length ? Math.round(vConverted.length / vP.length * 100) : 0}%) brought or sent a sample.</p></section></div>
      <div class="grid2">
        <section class="panel"><div class="panel-head"><h2>Win back</h2><span class="hint">no sample for 60+ days, biggest spenders first</span></div>
          ${lapsed.length ? `<div class="tbl-wrap"><table class="mini-table"><tbody>${lapsed.map(x => `<tr><td><b>${esc(x.c.name)}</b><br><span class="note">${esc(SEGMENT_LABEL[x.c.segment] || '')}</span></td><td class="num">${esc(x.c.phone || '')}</td><td class="r num">${kes(x.spend)}</td><td class="note">last ${esc(fmtDay(x.last))}</td></tr>`).join('')}</tbody></table></div>` : '<p class="note">Every client has tested in the last 60 days.</p>'}</section>
        <section class="panel"><div class="panel-head"><h2>Subscription prospects</h2><span class="hint">3+ samples or KES 20,000+ in 90 days, no plan</span></div>
          ${prospects.length ? `<div class="tbl-wrap"><table class="mini-table"><tbody>${prospects.map(x => `<tr><td><b>${esc(x.c.name)}</b><br><span class="note">${esc(SEGMENT_LABEL[x.c.segment] || '')}</span></td><td class="num">${esc(x.c.phone || '')}</td><td class="r num">${x.n} samples</td><td class="r num">${kes(x.spend)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="note">No prospects right now.</p>'}</section>
      </div>`;
  }
  function marketingCsv() {

    const q = v => { const x = v == null ? '' : String(v); return /[",\n]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x; };
    return [cols.join(',')].concat((data().clients || []).map(c => { const l = samples.filter(s => s.clientId === c.id).sort((a, b) => a.receivedAt.localeCompare(b.receivedAt)); const lo = loyaltyOf(c); const sub = subFor(c.id);
      return [c.name, c.phone, SEGMENT_LABEL[c.segment] || c.segment, c.type, c.county, l[0] ? l[0].heardVia : '', l[0] ? dayKey(l[0].receivedAt) : '', l.length ? dayKey(l[l.length - 1].receivedAt) : '', l.length, lo.spend, lo.tier ? lo.tier.name : '', sub ? sub.plan + ' (' + sub.status + ')' : '', c.portal ? 'yes' : 'no'].map(q).join(','); })).join('\n');
  }

          <div class="field"><label for="v-county">County the sample comes from</label><select id="v-county"><option value="">No sample / not known</option>${COUNTIES.map(c => `<option>${esc(c)}</option>`).join('')}</select></div>
          <div class="field"><label for="v-landmark">Nearest landmark</label><input id="v-landmark" placeholder="e.g. near Kandara market"></div>
          <div class="field"><label for="v-purpose">Purpose of visit</label><select id="v-purpose">${VISITOR_PURPOSES.map(p => `<option>${esc(p)}</option>`).join('')}</select></div>
        </div>
        <div class="field"><label for="v-notes">Notes</label><input id="v-notes" placeholder="Who they came to see, anything to follow up"></div>
        <div class="row"><button class="btn primary" type="submit" ${ro || !can('visitors') ? 'disabled' : ''}>Sign in visitor</button><span class="note" id="v-err" role="alert"></span></div>
      </form>
      <section class="panel"><div class="panel-head"><h2>Online visitors book</h2></div>
        <p>Visitors can sign in from their phone, or on a tablet at reception, at this address. Entries appear here.</p>
        <pre class="msg">${esc(visitUrl())}</pre>
        <div class="row"><button class="btn small primary" type="button" data-action="copy-visit">Copy link</button><a class="btn small" href="${esc(visitUrl())}" target="_blank" rel="noopener">Open the online book</a></div>
        <p class="note">Print the link as a QR code for the reception counter.</p>
      </section>
    </div>
    <section class="panel"><div class="panel-head"><h2>Visitors</h2><div class="row"><span class="hint">${todayN} today · ${list.length} in total</span><button class="btn small" type="button" data-action="export-visitors" ${list.length ? '' : 'disabled'}>Export CSV</button></div></div>
      <div class="filters"><input class="search" id="v-search" type="search" placeholder="Search name, phone, county, landmark" value="${esc(state.vsearch || '')}" aria-label="Search visitors"></div>
      ${shown.length ? `<div class="tbl-wrap"><table><thead><tr><th>When</th><th>Name</th><th>Phone</th><th>Email</th><th>County</th><th>Nearest landmark</th><th>Purpose</th><th>Notes</th><th>Signed</th></tr></thead><tbody>${rows}</tbody></table></div>` : `<div class="empty"><h3>${list.length ? 'No visitors match' : 'No visitors yet'}</h3><p>${list.length ? 'Try another search.' : 'Sign in the first visitor, or share the online book.'}</p></div>`}
    </section>`;
  }
  function visitorsCsv() {
    const cols = ['at', 'name', 'phone', 'email', 'county', 'landmark', 'purpose', 'notes', 'source'];
    const q = v => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    return [cols.join(',')].concat((data().visitors || []).map(v => cols.map(c => q(v[c])).join(','))).join('\n');
  }

  // CSV
  function csv() {
    const cols = ['id', 'sampleCode', 'batch', 'receivedAt', 'paidAt', 'testedAt', 'client', 'phone', 'clientType', 'county', 'landmark', 'sampleType', 'condition', 'grinding', 'packaging', 'description', 'tests', 'express', 'consultation', 'channel', 'agrovet', 'heardVia', 'price', 'paid', 'mpesa', 'status', 'dueAt', 'reportedAt', 'disposedAt', 'verdict', ...Object.keys(FIELDS)];
    const q = v => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const lines = [cols.join(',')];
    for (const s of filtered()) {
      const r = s.results || {};
      lines.push([s.id, sampleCode(s), s.batch || '', s.receivedAt, s.paidAt || '', s.startedAt || '', s.client.name, s.client.phone, s.client.type, s.county || s.client.area, s.landmark, s.sampleType, s.sampleState, s.grinding ? 'yes' : 'no', s.packaging, s.description, (s.tests || []).join(' '), s.express ? 'yes' : 'no', s.consult ? 'yes' : 'no', s.channel, s.agrovet, s.heardVia, s.price, s.paid ? 'yes' : 'no', s.mpesa, s.status, s.dueAt, s.reportedAt || '', s.disposedAt || '', overall(s) || '', ...Object.keys(FIELDS).map(f => r[f])].map(q).join(','));
    }
    return lines.join('\n');
  }

  // ---------- events ----------
  document.addEventListener('click', async ev => {
    const t = ev.target.closest('button, .drawer-back, [data-open]');
    if (!t) return;
    if (t.classList.contains('tab')) { setView(t.dataset.view, state.dept); return; }
    if (t.classList.contains('dept')) { const d = DEPTS.find(x => x[0] === t.dataset.dept); const first = d[2].find(x => canSee(x[0])); setView(first ? first[0] : 'dashboard', d[0]); return; }
    if (t.id === 'demoBtn') { toggleDemo(!state.demo); return; }
    if (t.id === 'themeBtn') { toggleTheme(); return; }
    if (t.id === 'guideBtn') { state.guideRole = null; setView('guide'); window.scrollTo({ top: 0 }); return; }
    if (t.id === 'refreshBtn') { loadData(); return; }
    if (t.id === 'signOutBtn') { signOut(false); return; }
    if (t.dataset.goto) { setView(t.dataset.goto); return; }
    if (t.dataset.open) { clearDirty(['r-', 'p-', 'd-']); state.selected = t.dataset.open; renderDrawer(); const d = $('.drawer'); if (d) d.focus(); return; }
    if (t.dataset.filter) { state.filter = t.dataset.filter; render(); return; }
    if (t.dataset.filterGo) { state.filter = t.dataset.filterGo === 'reported' ? 'reported' : t.dataset.filterGo; setView('samples'); return; }
    if (t.dataset.act) { drawerAction(t.dataset.act); return; }
    if (t.dataset.pmethod) { state.pickMethod = t.dataset.pmethod; render(); return; }
    if (t.dataset.clientOpen) { state.client = t.dataset.clientOpen; state.lastPin = null; clearDirty(['cl-']); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    if (t.dataset.cseg) { state.cseg = t.dataset.cseg; render(); return; }
    if (t.dataset.batchGo) { state.batch = t.dataset.batchGo; state.filter = 'all'; setView('samples'); return; }
    const a = t.dataset.action;
    if (a === 'enter-demo') toggleDemo(true);
    else if (a === 'exit-demo') toggleDemo(false);
    else if (a === 'copy-receipt' && state.lastCreated) copy(receiptMsg(state.lastCreated));
    else if (a === 'copy-close') copy($('#coNote').textContent);
    else if (a === 'pick-all') { const { samples } = data(); const m = state.pickMethod || 'All'; let n = Object.keys(state.picked).length; samples.filter(s => s.status === 'received' && s.paid && (m === 'All' || methodsOf(s).includes(m))).forEach(s => { if (!state.picked[s.id] && n < BATCH_MAX) { state.picked[s.id] = true; n++; } }); renderKeepScroll(); }
    else if (a === 'pick-none') { state.picked = {}; renderKeepScroll(); }
    else if (a === 'start-batch') {
      if (!canWriteNow()) return; const ids = Object.keys(state.picked); if (!ids.length) return;
      t.disabled = true; const ok = await startBatch(ids, ($('#pb-batch') || {}).value || '');
      if (ok) state.picked = {}; render();
    }
    else if (a === 'dispose-picked') {
      if (!canWriteNow()) return; const ids = Object.keys(state.dpicked || {}); if (!ids.length) return;
      t.disabled = true; if (await markDisposed(ids)) state.dpicked = {}; render();
    }
    else if (a === 'demo-login') {
      t.disabled = true;
      try { const j = await api('login', { name: t.dataset.name, pin: t.dataset.pin }); state.token = j.token; state.me = j.staff; saveSession(); await loadData(); goHome(); }
      catch (e) { toast(e.message); t.disabled = false; }
    }
    else if (a === 'demo-reset') { if (confirm('Reset the demo? This deletes every sample, visitor and change made in this demo and restores the starting records.')) { window.AGRILAB_DEMO.reset(); signOut(true); toast('Demo data reset'); } }
    else if (a === 'guide-open') { state.guideRole = null; state.view = 'guide'; render(); window.scrollTo({ top: 0 }); }
    else if (a === 'guide-close') { state.view = 'dashboard'; render(); }
    else if (a === 'f-today') { state.f.from = state.f.to = dayKey(now()); render(); }
    else if (a === 'f-week') { state.f.from = dayKey(new Date(now().getTime() - 6 * 864e5)); state.f.to = dayKey(now()); render(); }
    else if (a === 'f-clear') { state.f = { from: '', to: '', client: '', test: '' }; render(); }
    else if (a === 'mk-csv') saveFile(`agrilab-clients-${dayKey(now())}.csv`, marketingCsv(), 'text/csv');
    else if (a === 'sub-new') { state.subEdit = 'new'; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    else if (a === 'sub-edit') { state.subEdit = t.dataset.id; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    else if (a === 'sub-cancel-edit') { state.subEdit = null; render(); }
    else if (a === 'sub-pay') { state.subPay = t.dataset.id; render(); }
    else if (a === 'sub-pay-cancel') { state.subPay = null; render(); }
    else if (a === 'sub-save') {
      if (!canWriteNow()) return;
      const x = { plan: $('#sub-plan').value.trim(), fee: Number($('#sub-fee').value), quota: Number($('#sub-quota').value), extraDiscount: Number($('#sub-extra').value) || 0, status: $('#sub-status').value, notes: $('#sub-notes').value.trim() };
      if (state.subEdit === 'new') { x.clientId = $('#sub-client').value; if (!x.clientId) { toast('Choose the client'); return; } } else x.id = state.subEdit;
      const j = await call('saveSubscription', { subscription: x }, state.subEdit === 'new' ? 'Subscription started' : 'Plan saved');
      if (j) { const l = state.live.subscriptions; const i = l.findIndex(y => y.id === j.subscription.id); if (i >= 0) l[i] = j.subscription; else l.push(j.subscription); state.subEdit = null; render(); }
    }
    else if (a === 'sub-pay-save') {
      if (!canWriteNow()) return;
      const mp = $('#sp-mpesa').value.trim(); if (!mp) { toast('Enter the M-Pesa code'); return; }
      const j = await call('paySubscription', { id: t.dataset.id, mpesa: mp, amount: $('#sp-amount').value }, 'Plan payment saved');
      if (j) { const l = state.live.subscriptions; const i = l.findIndex(y => y.id === j.subscription.id); if (i >= 0) l[i] = j.subscription; state.live.subPayments.push(j.payment); state.subPay = null; render(); }
    }
    else if (a === 'client-close') { state.client = null; state.lastPin = null; clearDirty(['cl-']); render(); }
    else if (a === 'client-save') {
      if (!canWriteNow()) return;
      const c = { id: state.client, name: $('#cl-name').value.trim(), phone: $('#cl-phone').value.trim(), email: $('#cl-email').value.trim(), type: $('#cl-type').value, segment: $('#cl-seg').value, county: $('#cl-county').value, landmark: $('#cl-landmark').value.trim() };
      const j = await call('saveClient', { client: c }, 'Client saved');
      if (j) { const i = state.live.clients.findIndex(x => x.id === j.client.id); if (i >= 0) state.live.clients[i] = j.client; clearDirty(['cl-']); render(); }
    }
    else if (a === 'client-pin') {
      if (!canWriteNow()) return;
      const j = await call('setClientPin', { id: state.client }, 'Portal PIN created');
      if (j) { const i = state.live.clients.findIndex(x => x.id === j.client.id); if (i >= 0) state.live.clients[i] = j.client; state.lastPin = { id: j.client.id, pin: j.pin }; render(); }
    }
    else if (a === 'copy-invite') { const pre = document.querySelector('.box pre.msg'); if (pre) copy(pre.textContent); }
    else if (a === 'tier-add') { const d = state.tierDraft; const last = d.tiers[d.tiers.length - 1] || { minSpend: 0, discount: 0 }; d.tiers.push({ name: 'New tier', minSpend: last.minSpend + 50000, minTests: 0, minMonths: 0, discount: Math.min(50, last.discount + 5) }); render(); }
    else if (a === 'tier-del') { state.tierDraft.tiers.splice(Number(t.dataset.i), 1); render(); }
    else if (a === 'tier-reset') { state.tierDraft = null; render(); }
    else if (a === 'tier-save') {
      if (!canWriteNow()) return;
      const d = state.tierDraft;
      const j = await call('saveSettings', { settings: { tiers: d.tiers, period: d.period, retestDays: d.retestDays } }, 'Loyalty tiers saved');
      if (j) { state.live.settings = j.settings; state.tierDraft = null; loadData(true); }
    }
    else if (a === 'copy-visit') copy(visitUrl());
    else if (a === 'export-visitors') saveFile(`agrilab-visitors-${dayKey(now())}.csv`, visitorsCsv(), 'text/csv');
    else if (a === 'export-csv') {
      saveFile(`agrilab-samples-${dayKey(now())}.csv`, csv(), 'text/csv');
    }
    if (t.dataset.saveStock) {
      if (!canWriteNow()) return;
      const inp = document.getElementById('st-' + t.dataset.saveStock);
      if (!inp) return;
      const j = await call('updateStock', { id: t.dataset.saveStock, testsLeft: Number(inp.value) || 0 }, 'Stock updated');
      if (j) { const i = state.live.stock.findIndex(k => k.id === j.kit.id); if (i >= 0) state.live.stock[i] = j.kit; clearDirty(['st-' + t.dataset.saveStock]); render(); }
    }
  });
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && state.selected) { clearDirty(['r-', 'p-', 'd-']); state.selected = null; renderDrawer(); } });
  document.addEventListener('input', ev => {
    trackDirty(ev.target);
    const tm = ev.target.id && ev.target.id.match(/^tier-(\d+)-(\w+)$/);
    if (tm && state.tierDraft) { const k = tm[2]; state.tierDraft.tiers[Number(tm[1])][k] = k === 'name' ? ev.target.value : Number(ev.target.value) || 0; return; }
    if (ev.target.id === 'tier-retest' && state.tierDraft) { state.tierDraft.retestDays = Number(ev.target.value) || 30; return; }
    if (ev.target.id === 'search' || ev.target.id === 'v-search' || ev.target.id === 'c-search') {
      const id = ev.target.id; if (id === 'search') state.search = ev.target.value; else if (id === 'v-search') state.vsearch = ev.target.value; else state.csearch = ev.target.value;
      const pos = ev.target.selectionStart; render(); const s = document.getElementById(id); if (s) { s.focus(); try { s.setSelectionRange(pos, pos); } catch (e) {} }
    }
    else if (ev.target.closest && ev.target.closest('#newForm')) updateNewSummary();
  });
  document.addEventListener('change', ev => {
    trackDirty(ev.target);
    if (ev.target.id === 'n-stype' || ev.target.id === 'n-ctype') applyTypeDefaults();
    if (ev.target.closest && ev.target.closest('#newForm')) updateNewSummary();
    if (ev.target.id === 'co-day') { closeDay = ev.target.value; render(); }
    if (ev.target.id === 'batchSel') { state.batch = ev.target.value; render(); }
    const fm = { 'f-from': 'from', 'f-to': 'to', 'f-client': 'client', 'f-test': 'test' }[ev.target.id];
    if (fm) { state.f[fm] = ev.target.value; render(); }
    if (ev.target.id === 'g-role') { state.guideRole = ev.target.value; render(); }
    if (ev.target.id === 'm-period') { state.mperiod = Number(ev.target.value) || 90; render(); }
    if (ev.target.id === 'sub-preset') { const pr = PLAN_PRESETS[Number(ev.target.value)]; if (pr) { $('#sub-plan').value = pr.plan; $('#sub-fee').value = pr.fee; $('#sub-quota').value = pr.quota; $('#sub-extra').value = pr.extraDiscount; } }
    if (ev.target.id === 'tier-period' && state.tierDraft) { state.tierDraft.period = ev.target.value; }
    if (ev.target.dataset && (ev.target.dataset.pick || ev.target.dataset.dpick)) {
      const bag = ev.target.dataset.pick ? state.picked : (state.dpicked = state.dpicked || {}); const id = ev.target.dataset.pick || ev.target.dataset.dpick;
      if (ev.target.checked) bag[id] = true; else delete bag[id];
      renderKeepScroll();
    }
  });
  document.addEventListener('submit', async ev => {
    if (ev.target.id === 'loginForm') return doLogin(ev);
    if (ev.target.id === 'newForm') return submitNew(ev);
    if (ev.target.id === 'visitorForm') {
      ev.preventDefault(); const err = $('#v-err'); err.textContent = '';
      const v = { name: $('#v-name').value.trim(), phone: $('#v-phone').value.trim(), email: $('#v-email').value.trim(), county: $('#v-county').value, landmark: $('#v-landmark').value.trim(), purpose: $('#v-purpose').value, notes: $('#v-notes').value.trim() };
      if (!v.name) { err.textContent = 'Enter the visitor’s name.'; $('#v-name').focus(); return; }
      if (!v.phone && !v.email) { err.textContent = 'Enter a phone number or an email address.'; $('#v-phone').focus(); return; }
      if (!canWriteNow()) return;
      const j = await call('signVisitor', { visitor: v }, 'Visitor signed in');
      if (j && j.visitor) { state.live.visitors = [j.visitor].concat(state.live.visitors || []); clearDirty(['v-']); render(); }
      return;
    }
    if (ev.target.id === 'stockForm') {
      ev.preventDefault(); if (!canWriteNow()) return;
      const item = $('#s-item').value.trim(), lot = $('#s-lot').value.trim();
      if (!item || !lot) { toast('Enter the kit name and lot number'); return; }
      const j = await call('addStock', { kit: { item, lot, testsLeft: Number($('#s-tests').value) || 0, reorderAt: Number($('#s-reorder').value) || 0, expiry: $('#s-exp').value || '' } }, 'Kit lot added');
      if (j) { state.live.stock.push(j.kit); clearDirty(['s-']); render(); }
    }
    if (ev.target.id === 'qcForm') {
      ev.preventDefault(); if (!canWriteNow()) return;
      const num = id => { const v = $(id).value; return v === '' ? null : Number(v); };
      const j = await call('saveQC', { qc: { nir: $('#q-nir').value, elisa: $('#q-elisa').value, fridgeMin: num('#q-min'), fridgeMax: num('#q-max'), notes: $('#q-notes').value.trim() } }, 'QC saved');
      if (j) { state.live.qc = [j.qc].concat(state.live.qc.filter(q => q.date !== j.qc.date)); clearDirty(['q-']); render(); }
    }
  });
  function isDark() { const a = document.documentElement.getAttribute('data-theme'); return a === 'dark'; }
  function paintThemeBtn() { const b = $('#themeBtn'); if (!b) return; const d = isDark(); b.setAttribute('aria-label', d ? 'Switch to light theme' : 'Switch to dark theme'); b.innerHTML = d ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'; }
  function toggleTheme() { const next = isDark() ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', next); try { localStorage.setItem('agrilab-ops-theme', next); } catch (e) {} paintThemeBtn(); }
  paintThemeBtn();
  function renderKeepScroll() {
    const lists = [...document.querySelectorAll('.picklist')].map(el => el.scrollTop);
    render();
    document.querySelectorAll('.picklist').forEach((el, i) => { if (lists[i] != null) el.scrollTop = lists[i]; });
  }
  function toggleDemo(on) {
    state.demo = on; state.selected = null;
    if (on && !state.demoData) state.demoData = makeDemo();
    render();
  }

  // ---------- boot ----------
  const startView = (location.hash || '').replace('#', '');
  if (ALL_VIEWS.includes(startView)) { state.view = startView; state.dept = DEPTS.find(x => x[2].some(y => y[0] === startView))[0]; }
  render();

  function boot() {
    if (!API) { state.connected = 'none'; render(); return; }
    try { const sv = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); if (sv && sv.token) { state.token = sv.token; state.me = sv.me; } } catch (e) {}
    if (state.token) { state.connected = 'connecting'; loadData(); } else { state.connected = 'signedout'; render(); }
    setInterval(() => { if (document.visibilityState === 'visible' && state.token && !state.demo) loadData(true); }, 60000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && state.token && !state.demo && state.lastSync && (now() - state.lastSync) > 60000) loadData(true); });
  }
  boot();
})();
</script>
</body>
</html>
