<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1C1D4A">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>AgriLab Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Lexend:wght@500;600&display=swap">
<style>
/* Layout: a lab bench console. Summary tiles on top, a job board below, one drawer per sample. */
:root {
  --bg: #F1F3EC;
  --surface: #FBFCF8;
  --surface-2: #E7ECE0;
  --ink: #1C1D4A;
  --text: #3B3E5C;
  --muted: #61657F;
  --line: #D6DCCD;
  --accent: #2D7A38;
  --accent-ink: #F7FAF3;
  --accent-soft: #DCEBD8;
  --navy: #33358A;
  --good: #2D7A38; --good-soft: #DCEBD8;
  --warn: #9A5A00; --warn-soft: #FBE9C9;
  --bad: #B42318; --bad-soft: #FADAD5;
  --info: #33358A; --info-soft: #E2E3F6;
  --bar: #33358A;
  --logo-light: block; --logo-dark: none;
  --font-display: 'Lexend', Verdana, sans-serif;
  --font-body: 'IBM Plex Sans', Arial, sans-serif;
  --font-mono: 'IBM Plex Mono', 'Courier New', monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10112A; --surface: #191A3B; --surface-2: #222452; --ink: #F1F3F8; --text: #CBCEE6; --muted: #9EA2CC; --line: #2E3164;
    --accent: #6CC070; --accent-ink: #0E1A10; --accent-soft: #1E3A28; --navy: #B4B7F5;
    --good: #7CC97F; --good-soft: #1E3A28; --warn: #F0B45F; --warn-soft: #3B2C12; --bad: #F3877A; --bad-soft: #3D1C1A; --info: #B4B7F5; --info-soft: #262862;
    --bar: #9EA2F0; --logo-light: none; --logo-dark: block; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10112A; --surface: #191A3B; --surface-2: #222452; --ink: #F1F3F8; --text: #CBCEE6; --muted: #9EA2CC; --line: #2E3164;
  --accent: #6CC070; --accent-ink: #0E1A10; --accent-soft: #1E3A28; --navy: #B4B7F5;
  --good: #7CC97F; --good-soft: #1E3A28; --warn: #F0B45F; --warn-soft: #3B2C12; --bad: #F3877A; --bad-soft: #3D1C1A; --info: #B4B7F5; --info-soft: #262862;
  --bar: #9EA2F0; --logo-light: none; --logo-dark: block; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-display); color: var(--ink); margin: 0; line-height: 1.2; text-wrap: balance; }
h2 { font-size: 22px; font-weight: 600; }
h3 { font-size: 16px; font-weight: 600; }
p { margin: 0; }
.mono { font-family: var(--font-mono); }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
:focus-visible { outline: 3px solid var(--warn); outline-offset: 2px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-inner, .tabs-inner, main, .banner-inner { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-inner { display: flex; align-items: center; gap: 14px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand img { height: 34px; width: auto; }
.logo-on-light { display: var(--logo-light); }
.logo-on-dark { display: var(--logo-dark); }
.brand .app-name { font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); border-left: 1px solid var(--line); padding-left: 10px; }
.spacer { flex: 1; }
.conn { font-family: var(--font-mono); font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.conn.ok { background: var(--good-soft); color: var(--good); }
.conn.warn { background: var(--warn-soft); color: var(--warn); }
.tabs { background: var(--surface); border-bottom: 1px solid var(--line); }
.tabs-inner { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tab { border: 0; background: none; padding: 12px 14px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.banner { background: var(--warn-soft); color: var(--warn); }
.banner.demo { background: var(--info-soft); color: var(--info); }
.banner-inner { padding-block: 10px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-weight: 500; }
main { padding-block: 24px 64px; display: grid; gap: 24px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 999px; padding: 9px 16px; font-weight: 600; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); }
.btn.small { padding: 5px 12px; font-size: 13.5px; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 4px; }
.kpi .label { font-size: 12.5px; color: var(--muted); font-family: var(--font-mono); letter-spacing: 0.04em; text-transform: uppercase; }
.kpi .value { font-family: var(--font-display); font-size: 28px; font-weight: 600; color: var(--ink); line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .sub { font-size: 13px; color: var(--muted); }
.kpi.bad { border-color: var(--bad); background: var(--bad-soft); }
.kpi.bad .value { color: var(--bad); }
.kpi.warn { border-color: var(--warn); background: var(--warn-soft); }

.grid2 { display: grid; gap: 16px; }
@media (min-width: 980px) { .grid2 { grid-template-columns: 1.1fr 0.9fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.panel-head .hint { font-size: 13px; color: var(--muted); }

.alerts { display: grid; gap: 8px; }
.alert { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); border: 0; text-align: left; cursor: pointer; width: 100%; }
.alert .what { min-width: 0; }
.alert .what b { color: var(--ink); }
.alert .what span { display: block; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 560px) { .alert { grid-template-columns: auto 1fr; } .alert > .note { display: none; } }
.chip { font-family: var(--font-mono); font-size: 11.5px; font-weight: 500; padding: 3px 8px; border-radius: 999px; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.info { background: var(--info-soft); color: var(--info); }

.pipeline { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.stage { padding: 10px; border-radius: 10px; background: var(--surface-2); display: grid; gap: 2px; border: 0; text-align: left; cursor: pointer; }
.stage b { font-family: var(--font-display); font-size: 22px; color: var(--ink); }
.stage span { font-size: 12px; color: var(--muted); line-height: 1.25; }
@media (max-width: 560px) { .pipeline { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-family: var(--font-mono); font-size: 11px; }
.chart .val { fill: var(--ink); }
.hbars { display: grid; gap: 8px; }
.hbar { display: grid; grid-template-columns: minmax(90px, 160px) 1fr 44px; gap: 10px; align-items: center; font-size: 13.5px; }
.hbar .track { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.hbar .fill { height: 100%; background: var(--bar); border-radius: 99px; }
.hbar .n { text-align: right; font-family: var(--font-mono); color: var(--ink); }

.filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.fchip { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: 13.5px; font-weight: 500; }
.fchip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.search { flex: 1; min-width: 180px; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.jobs { display: grid; gap: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.job { display: grid; grid-template-columns: 150px minmax(0, 1.4fr) minmax(0, 1fr) 120px 130px 110px; gap: 12px; align-items: center; padding: 12px 16px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; cursor: pointer; width: 100%; }
.job:last-child { border-bottom: 0; }
.job:hover { background: var(--surface-2); }
.job.head { cursor: default; background: var(--surface-2); font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding-block: 8px; }
.job .id { font-family: var(--font-mono); font-size: 13px; color: var(--ink); font-weight: 500; }
.job .cell { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.job .cell small { display: block; color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 860px) {
  .job { grid-template-columns: 1fr auto; row-gap: 4px; }
  .job.head { display: none; }
  .job .c-sample, .job .c-due { display: none; }
}
.empty { padding: 32px 20px; text-align: center; display: grid; gap: 10px; justify-items: center; color: var(--muted); }
.empty h3 { color: var(--ink); }

form.panel { gap: 16px; }
.fgrid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
.field { display: grid; gap: 5px; min-width: 0; }
.field label, .field .lab { font-size: 13px; font-weight: 600; color: var(--ink); }
.field .help { font-size: 12.5px; color: var(--muted); }
input, select, textarea { width: 100%; min-width: 0; padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); }
input[type="checkbox"], input[type="radio"] { width: auto; }
textarea { min-height: 70px; resize: vertical; }
.tests { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); }
.test-opt { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); cursor: pointer; }
.test-opt.off { opacity: 0.45; cursor: not-allowed; }
.test-opt .code { font-family: var(--font-mono); font-size: 12px; color: var(--muted); display: block; }
.test-opt .p { font-family: var(--font-mono); font-size: 13px; color: var(--ink); }
.summary { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; padding: 14px 16px; border-radius: 10px; background: var(--accent-soft); }
.summary div { display: grid; }
.summary .k { font-size: 12px; color: var(--muted); font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.05em; }
.summary .v { font-family: var(--font-display); font-size: 20px; color: var(--ink); font-weight: 600; }

.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); }
table { width: 100%; border-collapse: collapse; font-size: 14px; background: var(--surface); }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 500; background: var(--surface-2); }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }

.drawer-back { position: fixed; inset: 0; background: rgba(12, 13, 34, 0.45); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--surface); z-index: 41; overflow-y: auto; box-shadow: -12px 0 32px rgba(12, 13, 34, 0.25); padding: calc(18px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) calc(32px + env(safe-area-inset-bottom, 0px)) 18px; display: grid; gap: 16px; align-content: start; }
.drawer-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
.drawer-head .id { font-family: var(--font-mono); font-size: 18px; color: var(--ink); font-weight: 500; }
.kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
.box { border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 12px; }
.results { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); }
.res-row { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.res-row:last-child { border-bottom: 0; }
.steps-mini { display: flex; gap: 4px; }
.steps-mini span { flex: 1; height: 5px; border-radius: 9px; background: var(--surface-2); }
.steps-mini span.on { background: var(--accent); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; z-index: 60; font-weight: 500; max-width: calc(100% - 32px); }
pre.msg { margin: 0; white-space: pre-wrap; font-family: var(--font-mono); font-size: 12.5px; background: var(--surface-2); padding: 12px; border-radius: 10px; color: var(--ink); }
.note { font-size: 13px; color: var(--muted); }
.who { font-size: 13px; color: var(--ink); font-weight: 600; white-space: nowrap; }
.who small { font-weight: 400; color: var(--muted); }
.login { max-width: 440px; width: 100%; margin: 24px auto; }
.login form { display: grid; gap: 14px; }
.login .err { color: var(--bad); font-size: 13.5px; min-height: 1.2em; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <img class="logo-on-light" src="../assets/logo-light.png" alt="AgriLab Solutions">
      <img class="logo-on-dark" src="../assets/logo-reversed.png" alt="AgriLab Solutions">
      <span class="app-name">Ops</span>
    </div>
    <span class="spacer"></span>
    <span class="conn" id="conn">Connecting…</span>
    <span class="who" id="who" hidden></span>
    <button class="btn small" id="refreshBtn" type="button" hidden>Refresh</button>
    <button class="btn small" id="demoBtn" type="button">Show example data</button>
    <button class="btn small" id="signOutBtn" type="button" hidden>Sign out</button>
  </div>
</header>
<nav class="tabs" id="tabs" aria-label="Sections">
  <div class="tabs-inner" role="tablist">
    <button class="tab" role="tab" data-view="dashboard" type="button">Dashboard</button>
    <button class="tab" role="tab" data-view="samples" type="button">Samples</button>
    <button class="tab" role="tab" data-view="new" type="button">New sample</button>
    <button class="tab" role="tab" data-view="stock" type="button">Stock &amp; QC</button>
    <button class="tab" role="tab" data-view="closeout" type="button">Close-out</button>
  </div>
</nav>
<div id="banner"></div>
<main id="view" aria-live="polite"></main>
<div id="drawerRoot"></div>
<div id="toastRoot"></div>

<script src="config.js"></script>
<script>
(() => {
  // ---------- reference data ----------
  const TESTS = {
    'NS-01': { name: 'NutriScan', price: 1500, kind: 'nir', fields: ['moisture', 'protein', 'fat', 'fibre', 'ash', 'starch'] },
    'AF-01': { name: 'AflaCheck Feed (B1 or total)', price: 2500, kind: 'elisa', fields: ['afb1', 'aft'] },
    'AF-02': { name: 'AflaCheck Feed (B1 and total)', price: 4000, kind: 'elisa', fields: ['afb1', 'aft'] },
    'AM-01': { name: 'AflaCheck Milk (M1)', price: 3000, kind: 'elisa', fields: ['afm1'], milk: true },
    'FS-01': { name: 'FeedSafe Combo', price: 3500, elisaPrice: 2500, kind: 'both', fields: ['moisture', 'protein', 'fat', 'fibre', 'ash', 'starch', 'afb1', 'aft'] },
    'MY-01': { name: 'Fumonisin', price: 2500, kind: 'elisa', fields: ['fum'] },
    'MY-02': { name: 'DON (vomitoxin)', price: 2500, kind: 'elisa', fields: ['don'] },
    'MY-03': { name: 'Zearalenone', price: 2500, kind: 'elisa', fields: ['zea'] },
    'MY-04': { name: 'Ochratoxin A', price: 2500, kind: 'elisa', fields: ['ota'] },
    'MP-01': { name: 'Mycotoxin panel', price: 8000, kind: 'elisa', fields: ['aft', 'fum', 'don', 'zea', 'ota'], hours: 72 }
  };
  const FIELDS = {
    moisture: { label: 'Moisture', unit: '%' }, protein: { label: 'Crude protein', unit: '%' }, fat: { label: 'Crude fat', unit: '%' },
    fibre: { label: 'Crude fibre', unit: '%' }, ash: { label: 'Ash', unit: '%' }, starch: { label: 'Starch', unit: '%' },
    afb1: { label: 'Aflatoxin B1', unit: 'µg/kg', limit: 5, basis: 'Kenyan limit for complete feed' },
    aft: { label: 'Total aflatoxin', unit: 'µg/kg', limit: 10, basis: 'East African limit for grains' },
    afm1: { label: 'Aflatoxin M1', unit: 'µg/l', limit: 0.5, basis: 'EAS 67 raw milk limit', eu: 0.05 },
    fum: { label: 'Fumonisin', unit: 'µg/kg' }, don: { label: 'DON (vomitoxin)', unit: 'µg/kg' },
    zea: { label: 'Zearalenone', unit: 'µg/kg' }, ota: { label: 'Ochratoxin A', unit: 'µg/kg' }
  };
  const SAMPLE_TYPES = ['Dairy meal or concentrate', 'Poultry feed', 'Pig feed', 'Fish feed', 'Feed ingredient (bran, seed cake, soya, fishmeal)', 'Maize or other grain', 'Flour', 'Milk powder', 'Raw milk', 'Processed milk', 'Other'];
  const MILK = ['Raw milk', 'Processed milk'];
  const CLIENT_TYPES = ['Dairy farmer', 'Dairy co-operative', 'Feed miller', 'Feed distributor', 'Agrovet', 'Poultry, pig or fish farmer', 'Grain trader or posho mill', 'Institution or researcher', 'Other'];
  const CHANNELS = ['Walk-in', 'Agrovet drop-off', 'Pickup', 'Courier'];
  const HEARD = ['Agrovet', 'Co-operative', 'Radio', 'Facebook or TikTok', 'WhatsApp', 'Google', 'Friend or neighbour', 'Open Lab Day', 'Vet or extension officer', 'Returning client', 'Other'];
  const STATUSES = [['received', 'Received'], ['analysis', 'In analysis'], ['review', 'Awaiting review'], ['ready', 'Signed, to send'], ['reported', 'Reported']];
  const STATUS_LABEL = Object.fromEntries(STATUSES);

  function handleErr(e) {

  function signOut(silent) {

  }
  const replaceSample = r => { const s = fromApi(r); const i = state.live.samples.findIndex(x => x.id === s.id); if (i >= 0) state.live.samples[i] = s; else state.live.samples.unshift(s); return s; };
  function saveFile(filename, text, type) {

  // ---------- rendering ----------

  // Dashboard
  function viewDashboard() {
    const { samples, stock, qc } = data();
    if (!samples.length && state.connected === 'connecting' && !state.demo) return `<div class="panel"><p class="note">Loading the lab’s records…</p></div>`;
    const today = dayKey(now());
    const monthKey = today.slice(0, 7);
    const inToday = samples.filter(s => dayKey(s.receivedAt) === today);
    const repToday = samples.filter(s => s.reportedAt && dayKey(s.reportedAt) === today);
    const open = samples.filter(s => s.status !== 'reported');
    const overdue = samples.filter(isOverdue);
    const unpaid = samples.filter(s => !s.paid);
    const month = samples.filter(s => dayKey(s.receivedAt).slice(0, 7) === monthKey);
    const revenue = month.filter(s => s.paid).reduce((a, s) => a + (s.price || 0), 0);
    const recent = samples.filter(s => s.reportedAt && (now() - new Date(s.reportedAt)) < 30 * 864e5);
    const tat = recent.length ? recent.reduce((a, s) => a + turnaroundH(s), 0) / recent.length : null;
    const flagged = samples.filter(s => ['above', 'close'].includes(overall(s)) && STATUS_INDEX[s.status] >= 2 && (now() - new Date(s.receivedAt)) < 14 * 864e5);
    const awaiting = samples.filter(s => s.status === 'review');
    const toSend = samples.filter(s => s.status === 'ready');
    const lowStock = stock.filter(k => Number(k.testsLeft) <= Number(k.reorderAt) || (k.expiry && k.expiry <= dayKey(new Date(now().getTime() + 30 * 864e5))));
    const qcToday = qc.find(q => q.date === today);

    if (!samples.length) {
      return `<div class="panel"><div class="empty"><h3>No samples logged yet</h3><p>The dashboard fills in as soon as the client desk logs the first sample.</p><div class="row"><button class="btn primary" data-goto="new" type="button">Log the first sample</button><button class="btn" data-action="enter-demo" type="button">Show example data</button></div></div></div>`;
    }

    const alerts = [];
    overdue.forEach(s => alerts.push({ sev: 'bad', label: 'Overdue', s, text: `due ${fmtDT(s.dueAt)}` }));
    flagged.forEach(s => alerts.push({ sev: overall(s) === 'above' ? 'bad' : 'warn', label: VERDICT_LABEL[overall(s)], s, text: flagSummary(s) }));
    awaiting.forEach(s => alerts.push({ sev: 'info', label: 'Needs sign-off', s, text: 'second sign-off by the lab manager' }));
    toSend.forEach(s => alerts.push({ sev: 'info', label: 'Ready to send', s, text: 'signed; send the report to the client' }));
    unpaid.filter(s => s.status !== 'received' || (now() - new Date(s.receivedAt)) > 2 * 3600e3).slice(0, 6).forEach(s => alerts.push({ sev: 'warn', label: 'Unpaid', s, text: `${kes(s.price)} not matched to M-Pesa` }));
    const alertHtml = alerts.length ? alerts.slice(0, 12).map(a => `<button class="alert" type="button" data-open="${esc(a.s.id)}"><span class="chip ${a.sev}">${esc(a.label)}</span><span class="what"><b class="mono">${esc(a.s.id)}</b> · ${esc(a.s.client && a.s.client.name)}<span>${esc(a.text)}</span></span><span class="note">Open</span></button>`).join('') : `<p class="note">Nothing needs attention right now.</p>`;
    const sysAlerts = [];
    lowStock.forEach(k => sysAlerts.push(`<div class="alert" style="cursor:default"><span class="chip warn">Stock</span><span class="what"><b>${esc(k.item)}</b><span>${esc(k.testsLeft)} tests left${k.expiry ? ' · expires ' + esc(k.expiry) : ''}</span></span><span></span></div>`));
    if (!qcToday) sysAlerts.push(`<div class="alert" style="cursor:default"><span class="chip warn">QC</span><span class="what"><b>Daily QC not logged today</b><span>NIR check sample, plate control, fridge temperature</span></span><span></span></div>`);
    else if (qcToday.nir === 'fail' || qcToday.elisa === 'fail') sysAlerts.push(`<div class="alert" style="cursor:default"><span class="chip bad">QC fail</span><span class="what"><b>A QC check failed today</b><span>${esc(qcToday.notes || 'See the QC log')}</span></span><span></span></div>`);

    const counts = STATUSES.map(([k]) => samples.filter(s => s.status === k && (k !== 'reported' || dayKey(s.reportedAt || s.receivedAt).slice(0, 7) === monthKey)).length);
    const pipeline = STATUSES.map(([k, l], i) => `<button class="stage" type="button" data-filter-go="${k}"><b class="num">${counts[i]}</b><span>${esc(l)}${k === 'reported' ? ' this month' : ''}</span></button>`).join('');

    return `
      <div class="kpis">
        <div class="kpi"><span class="label">Received today</span><span class="value">${inToday.length}</span><span class="sub">${repToday.length} reported today</span></div>
        <div class="kpi"><span class="label">Open jobs</span><span class="value">${open.length}</span><span class="sub">${awaiting.length} awaiting sign-off</span></div>
        <div class="kpi ${overdue.length ? 'bad' : ''}"><span class="label">Overdue</span><span class="value">${overdue.length}</span><span class="sub">${overdue.length ? 'past the promised time' : 'all on time'}</span></div>
        <div class="kpi ${unpaid.length ? 'warn' : ''}"><span class="label">Unpaid</span><span class="value">${unpaid.length}</span><span class="sub">${kes(unpaid.reduce((a, s) => a + (s.price || 0), 0))}</span></div>
        <div class="kpi"><span class="label">Paid this month</span><span class="value" style="font-size:22px">${kes(revenue)}</span><span class="sub">${month.length} samples received</span></div>
        <div class="kpi"><span class="label">Avg turnaround</span><span class="value">${tat == null ? '—' : tat.toFixed(1) + ' h'}</span><span class="sub">reported, last 30 days</span></div>
      </div>
      <div class="grid2">

        <div style="display:grid; gap:16px; align-content:start; min-width:0;">
          <section class="panel"><div class="panel-head"><h2>Pipeline</h2><span class="hint">tap a stage to see its samples</span></div><div class="pipeline">${pipeline}</div></section>
          <section class="panel"><div class="panel-head"><h2>Samples received</h2><span class="hint">last 14 days</span></div>${chart14(samples)}</section>
        </div>
      </div>
      <div class="grid2">
        <section class="panel"><div class="panel-head"><h2>How clients found us</h2><span class="hint">this month</span></div>${hbars(month.map(s => s.heardVia || 'Not recorded'))}</section>
        <section class="panel"><div class="panel-head"><h2>Tests sold</h2><span class="hint">this month</span></div>${hbars(month.flatMap(s => (s.tests || []).map(c => (TESTS[c] ? TESTS[c].name : c))))}</section>
      </div>`;
  }
  function flagSummary(s) {
    const r = s.results || {};
    return fieldsFor(s).filter(f => FIELDS[f].limit != null && r[f] !== '' && r[f] != null).map(f => `${FIELDS[f].label} ${r[f]} ${FIELDS[f].unit} (limit ${FIELDS[f].limit})`).join(' · ');
  }
  function chart14(samples) {
    const days = []; const t = now().getTime();
    for (let i = 13; i >= 0; i--) days.push(dayKey(new Date(t - i * 864e5)));
    const counts = days.map(d => samples.filter(s => dayKey(s.receivedAt) === d).length);
    const max = Math.max(4, ...counts);
    const W = 560, H = 170, left = 8, right = 8, top = 22, bottom = 26, bw = (W - left - right) / 14;
    const y = v => top + (H - top - bottom) * (1 - v / max);
    const bars = counts.map((c, i) => {
      const x = left + i * bw + 4, w = bw - 8, yy = y(c), h = (H - bottom) - yy;
      const lab = (i % 2 === 1 || i === 13) ? `<text x="${x + w / 2}" y="${H - 8}" text-anchor="middle">${esc(fmtDay(days[i] + 'T09:00:00Z').split(' ')[0])}</text>` : '';
      return `<rect x="${x}" y="${yy}" width="${w}" height="${Math.max(h, c ? 2 : 0)}" rx="3" fill="var(--bar)"></rect>${c ? `<text class="val" x="${x + w / 2}" y="${yy - 5}" text-anchor="middle">${c}</text>` : ''}${lab}`;
    }).join('');
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Samples received per day over the last 14 days"><line x1="${left}" x2="${W - right}" y1="${H - bottom}" y2="${H - bottom}" stroke="var(--line)"></line>${bars}</svg><p class="note">Day of the month under every other bar; today is the last bar.</p>`;
  }
  function hbars(list) {
    if (!list.length) return `<p class="note">No samples this month yet.</p>`;
    const m = {}; list.forEach(k => { m[k] = (m[k] || 0) + 1; });
    const rows = Object.entries(m).sort((a, b) => b[1] - a[1]).slice(0, 8);
    const max = rows[0][1];
    return `<div class="hbars">${rows.map(([k, n]) => `<div class="hbar"><span class="cell" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(k)}</span><span class="track"><span class="fill" style="width:${(n / max * 100).toFixed(1)}%;display:block"></span></span><span class="n">${n}</span></div>`).join('')}</div>`;
  }

  // Samples list
  const FILTERS = [['open', 'Open'], ['overdue', 'Overdue'], ['review', 'Awaiting review'], ['ready', 'To send'], ['flagged', 'Above or close to limit'], ['unpaid', 'Unpaid'], ['reported', 'Reported'], ['all', 'All']];
  function filtered() {
    const { samples } = data(); const q = state.search.trim().toLowerCase();
    return samples.filter(s => {
      const f = state.filter;
      if (f === 'open' && s.status === 'reported') return false;
      if (f === 'overdue' && !isOverdue(s)) return false;
      if (['received', 'analysis', 'review', 'ready', 'reported'].includes(f) && s.status !== f) return false;
      if (f === 'flagged' && !['above', 'close'].includes(overall(s))) return false;
      if (f === 'unpaid' && s.paid) return false;
      if (q) { const hay = [s.id, s.client && s.client.name, s.client && s.client.phone, s.sampleType, s.description, s.mpesa].join(' ').toLowerCase(); if (!hay.includes(q)) return false; }

  function readResults(s) {
    const out = Object.assign({}, s.results || {});
    for (const f of fieldsFor(s)) { const el = $('#r-' + f); if (!el) continue; const v = el.value.trim(); out[f] = v === '' ? null : Number(v); }
    return out;
  }
  function resultsMsg(s) {
    const r = s.results || {}; const ov = overall(s);
    const lines = fieldsFor(s).filter(f => r[f] != null && r[f] !== '').map(f => { const F = FIELDS[f]; const v = verdictOf(f, r[f]); return `${F.label}: ${r[f]} ${F.unit}${v ? ' (' + VERDICT_LABEL[v].toLowerCase() + ', limit ' + F.limit + ')' : ''}`; });
    let advice = '';
    if (ov === 'above') advice = '\nThis sample is above the legal limit. Please do not feed it to lactating cows. Reply HELP and our lab manager will call you.';
    else if (ov === 'close') advice = '\nThis sample is close to the limit. Store feed dry and test the next batch. Reply HELP for advice.';
    return `Hello ${s.client.name}, your AgriLab results for ${s.id} (${s.sampleType}) are ready.\n${lines.join('\n')}${ov ? '\nVerdict: ' + VERDICT_LABEL[ov] : ''}${advice}\nResults relate only to the sample tested. Know before you feed.`;
  }
  function reportHtml(s) {
    const r = s.results || {};
    const rows = fieldsFor(s).map(f => { const F = FIELDS[f]; const v = verdictOf(f, r[f]); return `<tr><td>${esc(F.label)}</td><td style="text-align:right">${r[f] == null || r[f] === '' ? '—' : esc(r[f])}</td><td>${esc(F.unit)}</td><td>${F.limit != null ? esc(F.limit) + ' (' + esc(F.basis) + ')' : '—'}</td><td>${v ? esc(VERDICT_LABEL[v]) : '—'}</td></tr>`; }).join('');
    const methods = [...new Set((s.tests || []).map(c => TESTS[c] && (TESTS[c].kind === 'nir' ? 'Near-infrared (NIR) analysis' : TESTS[c].kind === 'both' ? 'Near-infrared (NIR) analysis; ELISA' : 'ELISA')))].join('; ');
    const ov = overall(s);
    return `<!doctype html><html><head><meta charset="utf-8"><title>AgriLab report ${esc(s.id)}</title><style>body{font-family:Arial,sans-serif;color:#1C1D4A;max-width:760px;margin:32px auto;padding:0 20px;font-size:14px}h1{font-size:20px;margin:16px 0 4px}table{width:100%;border-collapse:collapse;margin:12px 0}td,th{border-bottom:1px solid #D6DCCD;padding:7px 6px;text-align:left}th{background:#E7ECE0;font-size:12px;text-transform:uppercase}.kv td:first-child{color:#61657F;width:170px}.v{display:inline-block;padding:6px 12px;border-radius:20px;background:${ov === 'above' ? '#FADAD5' : ov === 'close' ? '#FBE9C9' : '#DCEBD8'};font-weight:bold}.small{color:#61657F;font-size:12px}</style></head><body><img src="${LOGO}" alt="AgriLab Solutions" style="height:56px"><h1>Test report ${esc(s.id)}</h1><p class="small">AgriLab Solutions · Horizon Business Park, Kenol · +254 701 321 020 · lawrence@agrilabsolutions.com</p><table class="kv"><tr><td>Client</td><td>${esc(s.client.name)} (${esc(s.client.type)})</td></tr><tr><td>Sample</td><td>${esc(s.sampleType)}${s.description ? ' · ' + esc(s.description) : ''}</td></tr><tr><td>Date sampled</td><td>${esc(s.sampledOn || '—')}</td></tr><tr><td>Received</td><td>${esc(fmtDT(s.receivedAt))}</td></tr><tr><td>Reported</td><td>${esc(fmtDT(s.reportedAt || new Date().toISOString()))}</td></tr><tr><td>Tests</td><td>${esc((s.tests || []).map(c => TESTS[c] ? TESTS[c].name + ' (' + c + ')' : c).join(', '))}</td></tr><tr><td>Method</td><td>${esc(methods)}</td></tr></table><table><tr><th>Parameter</th><th style="text-align:right">Result</th><th>Unit</th><th>Limit</th><th>Verdict</th></tr>${rows}</table>${ov ? `<p>Overall: <span class="v">${esc(VERDICT_LABEL[ov])}</span></p>` : ''}${fieldsFor(s).includes('afm1') ? '<p class="small">Aflatoxin M1 is also compared by export buyers with the EU limit of 0.05 µg/kg.</p>' : ''}<p>Analysed by: ${esc(nameOf(s.analystId))} · Signed off by: ${esc(nameOf(s.reviewerId))}</p><p class="small">Results relate only to the sample as received. Sampling was the client’s responsibility unless AgriLab collected it. AgriLab Solutions is working towards ISO/IEC 17025 accreditation. Know before you feed.</p></body></html>`;
  }
  async function drawerAction(act) {
    const s = data().samples.find(x => x.id === state.selected); if (!s) return;
    if (act === 'close') { clearDirty(['r-', 'p-', 'd-']); state.selected = null; renderDrawer(); return; }
    if (act === 'copy-results') { copy(resultsMsg(s)); return; }
    if (act === 'download') { saveFile(`AgriLab-report-${s.id}.html`, reportHtml(s), 'text/html'); return; }
    if (!canWriteNow()) return;
    const flatResults = () => { const r = readResults(s); const out = {}; fieldsFor(s).forEach(f => { out[f] = r[f] == null || isNaN(r[f]) ? null : r[f]; }); return out; };
    let patch = null, msg = '';
    if (act === 'start') { patch = { status: 'analysis' }; msg = 'Analysis started'; }
    else if (act === 'save-results') { patch = flatResults(); msg = 'Results saved'; }
    else if (act === 'to-review') {
      const res = flatResults();
      const missing = (s.tests || []).filter(c => !TESTS[c].fields.some(f => res[f] != null));
      if (missing.length) { toast('Enter at least one result for ' + missing.join(', ')); return; }
      patch = Object.assign(res, { status: 'review' }); msg = 'Sent for review';
    }
    else if (act === 'sign') { patch = { status: 'ready' }; msg = 'Signed off'; }
    else if (act === 'return') { patch = { status: 'analysis' }; msg = 'Returned to analyst'; }
    else if (act === 'mark-sent') { patch = { status: 'reported' }; msg = 'Marked as sent'; }
    else if (act === 'save-pay') {
      const paid = $('#p-paid').checked, mpesa = $('#p-mpesa').value.trim().toUpperCase(), price = Number($('#p-amt').value) || 0;
      if (paid && !mpesa && price > 0) { toast('Enter the M-Pesa code first'); return; }
      patch = { paid, mpesa, price }; msg = 'Payment saved';
    }
    else if (act === 'save-notes') { patch = { notes: $('#d-notes').value }; msg = 'Notes saved'; }
    if (!patch) return;
    const busy = document.querySelector(`.drawer [data-act="${act}"]`); if (busy) busy.disabled = true;
    const j = await call('updateSample', { id: s.id, patch, expect: s.updatedAt }, msg);
    if (j) { replaceSample(j.sample); clearDirty(['r-', 'p-', 'd-']); render(); }
    else if (busy) busy.disabled = false;
  }

  // Stock & QC
  function viewStock() {
    const { stock, qc } = data(); const ro = state.readOnly || state.canWrite === false;
    const soon = dayKey(new Date(now().getTime() + 30 * 864e5)), today = dayKey(now());
    const rows = stock.slice().sort((a, b) => String(a.item).localeCompare(String(b.item))).map(k => {
      const low = Number(k.testsLeft) <= Number(k.reorderAt); const exp = k.expiry && k.expiry < today; const expSoon = k.expiry && !exp && k.expiry <= soon;
      return `<tr><td>${esc(k.item)}</td><td class="mono">${esc(k.lot)}</td><td class="r"> <input type="number" min="0" value="${esc(k.testsLeft)}" id="st-${esc(k.id)}" style="width:90px;text-align:right" aria-label="Tests left for ${esc(k.item)} lot ${esc(k.lot)}" ${ro ? 'disabled' : ''}></td><td class="r num">${esc(k.reorderAt)}</td><td class="num">${esc(k.expiry || '—')}</td><td>${exp ? '<span class="chip bad">Expired</span>' : low ? '<span class="chip warn">Reorder</span>' : expSoon ? '<span class="chip warn">Expires soon</span>' : '<span class="chip good">OK</span>'}</td><td><button class="btn small" type="button" data-save-stock="${esc(k.id)}" ${ro ? 'disabled' : ''}>Save</button></td></tr>`;
    }).join('');
    const qcRows = qc.slice().sort((a, b) => String(b.date).localeCompare(String(a.date))).slice(0, 14).map(q => `<tr><td class="num">${esc(q.date)}</td><td><span class="chip ${q.nir === 'pass' ? 'good' : q.nir === 'fail' ? 'bad' : ''}">${esc(q.nir)}</span></td><td><span class="chip ${q.elisa === 'pass' ? 'good' : q.elisa === 'fail' ? 'bad' : ''}">${esc(q.elisa)}</span></td><td class="r num">${q.fridgeMin == null ? '—' : esc(q.fridgeMin)}–${q.fridgeMax == null ? '—' : esc(q.fridgeMax)} °C</td><td style="white-space:normal">${esc(q.notes || '')}</td><td>${esc(nameOf(q.by))}</td></tr>`).join('');
    const tq = qc.find(q => q.date === today) || {};
    const sel = (id, val) => `<select id="${id}" ${ro ? 'disabled' : ''}>${['pass', 'fail', 'not run'].map(o => `<option ${val === o ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
    return `<section class="panel"><div class="panel-head"><h2>Test kit stock</h2><span class="hint">Reorder when tests left reach the reorder level; kits stay at 2–8 °C.</span></div>
      ${stock.length ? `<div class="tbl-wrap"><table><thead><tr><th>Kit</th><th>Lot</th><th class="r">Tests left</th><th class="r">Reorder at</th><th>Expiry</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>` : `<div class="empty"><h3>No kits recorded</h3><p>Add each kit lot when it arrives.</p></div>`}
      <form id="stockForm" class="fgrid" novalidate style="align-items:end">
        <div class="field"><label for="s-item">Kit</label><input id="s-item" list="kitList" placeholder="e.g. Aflatoxin M1 ELISA kit" ${ro ? 'disabled' : ''}><datalist id="kitList"><option>Aflatoxin B1 ELISA kit</option><option>Total aflatoxin ELISA kit</option><option>Aflatoxin M1 ELISA kit</option><option>Fumonisin ELISA kit</option><option>DON ELISA kit</option><option>Zearalenone ELISA kit</option><option>Ochratoxin A ELISA kit</option></datalist></div>
        <div class="field"><label for="s-lot">Lot number</label><input id="s-lot" class="mono" ${ro ? 'disabled' : ''}></div>
        <div class="field"><label for="s-tests">Tests in lot</label><input id="s-tests" type="number" min="1" value="84" ${ro ? 'disabled' : ''}></div>
        <div class="field"><label for="s-reorder">Reorder at</label><input id="s-reorder" type="number" min="0" value="40" ${ro ? 'disabled' : ''}></div>
        <div class="field"><label for="s-exp">Expiry</label><input id="s-exp" type="date" ${ro ? 'disabled' : ''}></div>
        <div class="field"><button class="btn primary" type="submit" ${ro ? 'disabled' : ''}>Add kit lot</button></div>
      </form></section>
      <section class="panel"><div class="panel-head"><h2>Daily QC log</h2><span class="hint">Log once a day before results are released.</span></div>
      <form id="qcForm" class="fgrid" novalidate style="align-items:end">
        <div class="field"><label for="q-nir">NIR check sample</label>${sel('q-nir', tq.nir || 'pass')}</div>
        <div class="field"><label for="q-elisa">ELISA plate control</label>${sel('q-elisa', tq.elisa || 'not run')}</div>
        <div class="field"><label for="q-min">Fridge min °C</label><input id="q-min" type="number" step="0.1" value="${tq.fridgeMin == null ? '' : esc(tq.fridgeMin)}" ${ro ? 'disabled' : ''}></div>
        <div class="field"><label for="q-max">Fridge max °C</label><input id="q-max" type="number" step="0.1" value="${tq.fridgeMax == null ? '' : esc(tq.fridgeMax)}" ${ro ? 'disabled' : ''}></div>
        <div class="field" style="grid-column: 1 / -1"><label for="q-notes">Notes</label><input id="q-notes" value="${esc(tq.notes || '')}" placeholder="Anything out of the ordinary" ${ro ? 'disabled' : ''}></div>
        <div class="field"><button class="btn primary" type="submit" ${ro ? 'disabled' : ''}>${tq.date ? 'Update today’s QC' : 'Save today’s QC'}</button></div>
      </form>
      ${qc.length ? `<div class="tbl-wrap"><table><thead><tr><th>Date</th><th>NIR check</th><th>ELISA control</th><th class="r">Fridge</th><th>Notes</th><th>By</th></tr></thead><tbody>${qcRows}</tbody></table></div>` : `<p class="note">No QC entries yet.</p>`}
      </section>`;
  }

  // Close-out
  let closeDay = null;
  function viewCloseout() {
    const { samples } = data(); const d = closeDay || dayKey(now());
    const inDay = samples.filter(s => dayKey(s.receivedAt) === d);
    const reported = samples.filter(s => s.reportedAt && dayKey(s.reportedAt) === d);
    const expected = inDay.reduce((a, s) => a + (s.price || 0), 0);
    const paid = inDay.filter(s => s.paid);
    const paidSum = paid.reduce((a, s) => a + (s.price || 0), 0);
    const unpaid = inDay.filter(s => !s.paid);
    const overdue = samples.filter(isOverdue);
    const rows = inDay.map(s => `<tr><td class="mono">${esc(s.id)}</td><td>${esc(s.client.name)}</td><td class="r num">${esc((s.price || 0).toLocaleString('en-KE'))}</td><td>${s.paid ? '<span class="chip good">Paid</span>' : '<span class="chip warn">Unpaid</span>'}</td><td class="mono">${esc(s.mpesa || '—')}</td><td>${esc(STATUS_LABEL[s.status])}</td></tr>`).join('');
    const note = `AgriLab close-out ${d}\nSamples in: ${inDay.length} · Reports sent: ${reported.length} · Overdue: ${overdue.length}\nPayments matched: ${paid.length} of ${inDay.length} (${kes(paidSum)} of ${kes(expected)})${unpaid.length ? '\nUnpaid: ' + unpaid.map(s => s.id).join(', ') : ''}${overdue.length ? '\nOverdue: ' + overdue.map(s => s.id).join(', ') : ''}\nIssues: `;
    return `<section class="panel"><div class="panel-head"><h2>Daily close-out</h2><div class="row"><label for="co-day" class="note">Day</label><input id="co-day" type="date" value="${d}" style="width:auto"></div></div>
      <div class="kpis">
        <div class="kpi"><span class="label">Samples in</span><span class="value">${inDay.length}</span></div>
        <div class="kpi"><span class="label">Reports sent</span><span class="value">${reported.length}</span></div>
        <div class="kpi ${unpaid.length ? 'warn' : ''}"><span class="label">Paid / expected</span><span class="value" style="font-size:20px">${kes(paidSum)}</span><span class="sub">of ${kes(expected)}</span></div>
        <div class="kpi ${overdue.length ? 'bad' : ''}"><span class="label">Overdue now</span><span class="value">${overdue.length}</span></div>
      </div>
      ${inDay.length ? `<div class="tbl-wrap"><table><thead><tr><th>Sample</th><th>Client</th><th class="r">KES</th><th>Payment</th><th>M-Pesa</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>` : `<p class="note">No samples received on this day.</p>`}
      <div class="box"><h3>Note for the team group</h3><pre class="msg" id="coNote">${esc(note)}</pre><div class="row"><button class="btn primary small" type="button" data-action="copy-close">Copy close-out note</button><span class="note">Check each M-Pesa code against the till statement before sending.</span></div></div>
    </section>`;
  }

  // CSV
  function csv() {
    const cols = ['id', 'receivedAt', 'client', 'phone', 'clientType', 'area', 'sampleType', 'description', 'tests', 'express', 'channel', 'agrovet', 'heardVia', 'price', 'paid', 'mpesa', 'status', 'dueAt', 'reportedAt', 'verdict', ...Object.keys(FIELDS)];
    const q = v => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const lines = [cols.join(',')];
    for (const s of filtered()) {
      const r = s.results || {};
      lines.push([s.id, s.receivedAt, s.client.name, s.client.phone, s.client.type, s.client.area, s.sampleType, s.description, (s.tests || []).join(' '), s.express ? 'yes' : 'no', s.channel, s.agrovet, s.heardVia, s.price, s.paid ? 'yes' : 'no', s.mpesa, s.status, s.dueAt, s.reportedAt || '', overall(s) || '', ...Object.keys(FIELDS).map(f => r[f])].map(q).join(','));
    }
    return lines.join('\n');
  }

  // ---------- events ----------
  document.addEventListener('click', async ev => {
    const t = ev.target.closest('button, .drawer-back, [data-open]');
    if (!t) return;
    if (t.classList.contains('tab')) { setView(t.dataset.view); return; }
    if (t.id === 'demoBtn') { toggleDemo(!state.demo); return; }
    if (t.id === 'refreshBtn') { loadData(); return; }
    if (t.id === 'signOutBtn') { signOut(false); return; }
    if (t.dataset.goto) { setView(t.dataset.goto); return; }
    if (t.dataset.open) { clearDirty(['r-', 'p-', 'd-']); state.selected = t.dataset.open; renderDrawer(); const d = $('.drawer'); if (d) d.focus(); return; }
    if (t.dataset.filter) { state.filter = t.dataset.filter; render(); return; }
    if (t.dataset.filterGo) { state.filter = t.dataset.filterGo === 'reported' ? 'reported' : t.dataset.filterGo; setView('samples'); return; }
    if (t.dataset.act) { drawerAction(t.dataset.act); return; }
    const a = t.dataset.action;
    if (a === 'enter-demo') toggleDemo(true);
    else if (a === 'exit-demo') toggleDemo(false);
    else if (a === 'copy-receipt' && state.lastCreated) copy(receiptMsg(state.lastCreated));
    else if (a === 'copy-close') copy($('#coNote').textContent);
    else if (a === 'export-csv') {
      saveFile(`agrilab-samples-${dayKey(now())}.csv`, csv(), 'text/csv');
    }
    if (t.dataset.saveStock) {
      if (!canWriteNow()) return;
      const inp = document.getElementById('st-' + t.dataset.saveStock);
      if (!inp) return;
      const j = await call('updateStock', { id: t.dataset.saveStock, testsLeft: Number(inp.value) || 0 }, 'Stock updated');
      if (j) { const i = state.live.stock.findIndex(k => k.id === j.kit.id); if (i >= 0) state.live.stock[i] = j.kit; clearDirty(['st-' + t.dataset.saveStock]); render(); }
    }
  });
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && state.selected) { clearDirty(['r-', 'p-', 'd-']); state.selected = null; renderDrawer(); } });
  document.addEventListener('input', ev => {
    trackDirty(ev.target);
    if (ev.target.id === 'search') { state.search = ev.target.value; const pos = ev.target.selectionStart; render(); const s = $('#search'); if (s) { s.focus(); try { s.setSelectionRange(pos, pos); } catch (e) {} } }
    else if (ev.target.closest && ev.target.closest('#newForm')) updateNewSummary();
  });
  document.addEventListener('change', ev => {
    trackDirty(ev.target);
    if (ev.target.closest && ev.target.closest('#newForm')) updateNewSummary();
    if (ev.target.id === 'co-day') { closeDay = ev.target.value; render(); }
  });
  document.addEventListener('submit', async ev => {
    if (ev.target.id === 'loginForm') return doLogin(ev);
    if (ev.target.id === 'newForm') return submitNew(ev);
    if (ev.target.id === 'stockForm') {
      ev.preventDefault(); if (!canWriteNow()) return;
      const item = $('#s-item').value.trim(), lot = $('#s-lot').value.trim();
      if (!item || !lot) { toast('Enter the kit name and lot number'); return; }
      const j = await call('addStock', { kit: { item, lot, testsLeft: Number($('#s-tests').value) || 0, reorderAt: Number($('#s-reorder').value) || 0, expiry: $('#s-exp').value || '' } }, 'Kit lot added');
      if (j) { state.live.stock.push(j.kit); clearDirty(['s-']); render(); }
    }
    if (ev.target.id === 'qcForm') {
      ev.preventDefault(); if (!canWriteNow()) return;
      const num = id => { const v = $(id).value; return v === '' ? null : Number(v); };
      const j = await call('saveQC', { qc: { nir: $('#q-nir').value, elisa: $('#q-elisa').value, fridgeMin: num('#q-min'), fridgeMax: num('#q-max'), notes: $('#q-notes').value.trim() } }, 'QC saved');
      if (j) { state.live.qc = [j.qc].concat(state.live.qc.filter(q => q.date !== j.qc.date)); clearDirty(['q-']); render(); }
    }
  });
  function toggleDemo(on) {
    state.demo = on; state.selected = null;
    if (on && !state.demoData) state.demoData = makeDemo();
    render();
  }

  // ---------- boot ----------
  const startView = (location.hash || '').replace('#', '');
  if (['dashboard', 'samples', 'new', 'stock', 'closeout'].includes(startView)) state.view = startView;
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.view === state.view)));
  render();

  function boot() {
    if (!API) { state.connected = 'none'; render(); return; }
    try { const sv = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); if (sv && sv.token) { state.token = sv.token; state.me = sv.me; } } catch (e) {}
    if (state.token) { state.connected = 'connecting'; loadData(); } else { state.connected = 'signedout'; render(); }
    setInterval(() => { if (document.visibilityState === 'visible' && state.token && !state.demo) loadData(true); }, 60000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && state.token && !state.demo && state.lastSync && (now() - state.lastSync) > 60000) loadData(true); });
  }
  boot();
})();
</script>
</body>
</html>
